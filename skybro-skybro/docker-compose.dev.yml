name: skybro-dev

services:
  tracker:
    build: ./tracker
    # Matches prod's Umbrel-injected name so refresh_photos.py and docs
    # work unchanged against either environment (only one runs at a time).
    container_name: skybro-skybro_tracker_1
    restart: unless-stopped
    volumes:
      - /home/umbrel/umbrel/app-data/skybro-skybro/data:/data
      - /etc/localtime:/etc/localtime:ro

  web:
    build:
      context: ./dashboard
      args:
        GIT_SHA: "${GIT_SHA:-dev}"
    # Must match prod's Umbrel-injected name: the real app_proxy (already
    # running from the installed prod app) routes to APP_HOST=skybro-skybro_web_1.
    # Stop prod first so this container can claim that name and get routed to.
    container_name: skybro-skybro_web_1
    restart: unless-stopped
    volumes:
      - /home/umbrel/umbrel/app-data/skybro-skybro/data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - tracker
    networks:
      - umbrel_main_network

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network
