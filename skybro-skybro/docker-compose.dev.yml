services:
  tracker:
    build: ./tracker
    container_name: skybro-tracker
    restart: unless-stopped
    volumes:
      - /home/umbrel/umbrel/app-data/skybro-skybro/data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - skybro-net

  web:
    build:
      context: ./dashboard
      args:
        GIT_SHA: "${GIT_SHA:-dev}"
    container_name: skybro-web
    restart: unless-stopped
    volumes:
      - /home/umbrel/umbrel/app-data/skybro-skybro/data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - tracker
    networks:
      - umbrel_main_network
      - skybro-net

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network
  skybro-net:
    name: skybro-net
