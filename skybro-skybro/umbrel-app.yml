releaseNotes: >-
  v1.3.0 — Astronomy tab with Tonight highlights, Planets, DSOs (all 110
  Messier objects), Meteor showers, and Moon sub-tabs powered by ephem.
  Satellites tab now covers ISS, Hubble, and Tiangong. History moved into
  the Aircraft tab with search and favourite/star button. Per-airframe map
  icons (jet, widebody, helicopter, light prop, military). Metric/Aviation
  units toggle for altitude/speed and temperature separately. Aircraft cards
  show blue accent when in alert range.
