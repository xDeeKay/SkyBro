services:

  app_proxy:
    environment:
      APP_HOST: skybro-web
      APP_PORT: 5000

  tracker:
    image: xdeekay/skybro-tracker:1.5.0
    container_name: skybro-tracker
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - skybro-net

  web:
    image: xdeekay/skybro-dashboard:1.5.0
    container_name: skybro-web
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - tracker
    networks:
      - default
      - skybro-net

networks:
  default:
    external: true
    name: umbrel_main_network
  skybro-net:
    name: skybro-net
