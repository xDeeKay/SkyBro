services:

  app_proxy:
    environment:
      APP_HOST: skybro-skybro_web_1
      APP_PORT: 5000

  tracker:
    image: xdeekay/skybro-tracker:1.5.2@sha256:e3f68fce0c85b6d0f908bf40f39ae065cdda3e31edf2030d3509a9bf65a393d8
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /etc/localtime:/etc/localtime:ro

  web:
    image: xdeekay/skybro-dashboard:1.5.2@sha256:6251ba77a453698aa4d8427ed3c87c1a624636b84db892a81116649a3deeb94d
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - tracker
