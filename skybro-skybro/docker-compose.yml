services:

  app_proxy:
    environment:
      APP_HOST: skybro-skybro_web_1
      APP_PORT: 5000

  tracker:
    image: xdeekay/skybro-tracker:1.5.3
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /etc/localtime:/etc/localtime:ro

  web:
    image: xdeekay/skybro-dashboard:1.5.3
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - tracker
