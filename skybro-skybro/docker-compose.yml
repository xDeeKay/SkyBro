services:

  app_proxy:
    environment:
      APP_HOST: skybro-skybro_web_1
      APP_PORT: 5000

  tracker:
    image: xdeekay/skybro-tracker:1.5.3@sha256:f5aed3574a3dbca1c28194e9a15fa7c2e7f6e1f8c28621bb6bf3caca7553334b
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /etc/localtime:/etc/localtime:ro

  web:
    image: xdeekay/skybro-dashboard:1.5.3@sha256:c873f2fd94d2404d9db200a25f1729da3a2092450c12a109993801b173856961
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - tracker
