<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyBro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3248;
  --text:#e2e4f0;--muted:#7b7f9e;--accent:#4f7cff;
  --green:#2ecc71;--amber:#f39c12;--red:#e74c3c;--teal:#1abc9c;
  --font:system-ui,-apple-system,sans-serif;
  --sidebar-w:clamp(240px,28vw,340px);
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:16px}
.logo{font-size:17px;font-weight:700;letter-spacing:-0.3px;white-space:nowrap}.logo span{color:var(--accent)}
.stats{display:flex;gap:16px;flex:1;justify-content:center}
.stat{text-align:center}.stat-val{font-size:19px;font-weight:700;color:var(--accent);line-height:1}.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.header-right{display:flex;align-items:center;gap:12px}
.live-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
.settings-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;text-decoration:none;transition:border-color .15s}
.settings-btn:hover{border-color:var(--accent)}
.main{display:flex;flex:1;overflow:hidden;position:relative}
#map{flex:1;min-width:0}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transition:width .2s ease}
.sidebar.collapsed{width:0;min-width:0;border:none}
.sidebar-tab{position:absolute;right:var(--sidebar-w);top:50%;transform:translateY(-50%);width:18px;height:44px;background:var(--surface);border:1px solid var(--border);border-right:none;border-radius:6px 0 0 6px;cursor:pointer;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;z-index:500;transition:right .2s ease;padding:0;line-height:1;user-select:none}
.sidebar-tab:hover{color:var(--text);background:var(--surface2)}
.sidebar.collapsed~.sidebar-tab{right:0}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{flex:1;min-width:max-content;padding:9px 6px;text-align:center;cursor:pointer;color:var(--muted);font-size:11px;font-weight:500;border-bottom:2px solid transparent;transition:all .15s;user-select:none;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text)}
.tab-pane{flex:1;overflow-y:auto;padding:12px;display:none}
.tab-pane.active{display:block}
.plane-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.plane-card:hover{border-color:var(--accent)}
.plane-card.alert{border-left:3px solid var(--amber)}
.pc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.pc-call{font-weight:700;font-size:14px}.pc-dist{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:2px 7px;font-size:11px;color:var(--muted)}
.pc-model{color:var(--muted);font-size:11px;margin-bottom:8px}
.pc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pstat{background:var(--surface);border-radius:5px;padding:5px 7px}
.pstat-val{font-weight:600;font-size:12px}.pstat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase}
.iss-card{background:var(--surface2);border:1px solid var(--teal);border-radius:8px;padding:12px;margin-bottom:8px}
.iss-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.iss-title{font-weight:700;color:var(--teal);font-size:14px}
.iss-soon{background:var(--teal);color:#000;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700}
.iss-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.hist-call{font-weight:600;font-size:13px}
.hist-sub{font-size:11px;color:var(--muted);margin-top:2px}
.hist-meta{text-align:right;font-size:11px;color:var(--muted)}
.hist-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.hist-card:hover{border-color:var(--accent)}
.hc-top{display:flex;gap:9px;align-items:flex-start}
.hc-thumb{width:70px;height:52px;object-fit:cover;border-radius:5px;flex-shrink:0;cursor:pointer;transition:opacity .15s}
.hc-thumb:hover{opacity:.75}
.hc-body{flex:1;min-width:0}
.hc-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.hc-call{font-weight:700;font-size:13px}
.hc-time{font-size:10px;color:var(--muted);white-space:nowrap;padding-left:6px}
.hc-model{font-size:11px;color:var(--muted);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc-tags{display:flex;flex-wrap:wrap;gap:3px}
.hc-tag{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:10px;color:var(--muted)}
.hc-loc{display:block;margin-top:7px;padding-top:6px;border-top:1px solid var(--border);font-size:10px;color:var(--accent);text-decoration:none}
.hc-loc:hover{text-decoration:underline}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;gap:12px}
.lb.open{display:flex}
.lb img{max-width:90vw;max-height:80vh;border-radius:8px;object-fit:contain;cursor:default}
.lb-close{position:absolute;top:14px;right:18px;color:#fff;font-size:26px;line-height:1;opacity:.6;cursor:pointer}
.lb-close:hover{opacity:1}
.lb-credit{font-size:11px;color:rgba(255,255,255,.45)}
.lb-credit a{color:rgba(255,255,255,.65);text-decoration:none}
.lb-credit a:hover{text-decoration:underline}
@keyframes ghost-pulse{0%,100%{opacity:.55}50%{opacity:.2}}
.ghost-plane{animation:ghost-pulse 2s ease-in-out infinite}
.empty{color:var(--muted);text-align:center;padding:32px 16px;font-size:13px;line-height:1.6}
.src-bar{display:flex;gap:0;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.src-item{flex:1;display:flex;align-items:center;gap:5px;padding:6px 8px;font-size:10px;color:var(--muted);min-width:0;border-right:1px solid var(--border)}
.src-item:last-child{border-right:none}
.src-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--border)}
.src-dot.ok{background:var(--green)}.src-dot.error{background:var(--red)}.src-dot.backoff{background:var(--amber)}.src-dot.no_key{background:var(--amber)}
.src-info{min-width:0;overflow:hidden;flex:1}
.src-name{font-weight:600;white-space:nowrap}.src-detail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.pc-photo{width:100%;height:80px;object-fit:cover;border-radius:5px;margin-bottom:7px;display:block}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--surface)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@media (max-width:600px){
  .sidebar{position:absolute;right:0;top:0;height:100%;z-index:400;width:80vw;max-width:300px;transition:transform .2s ease;transform:translateX(0)}
  .sidebar.collapsed{width:80vw;max-width:300px;min-width:0;border-left:1px solid var(--border);transform:translateX(100%)}
  .sidebar-tab{right:min(80vw,300px)}
  .sidebar.collapsed~.sidebar-tab{right:0}
}
</style>
</head>
<body>

<header>
  <div class="logo">Sky<span>Bro</span></div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="s-live">—</div><div class="stat-lbl">Live</div></div>
    <div class="stat"><div class="stat-val" id="s-today">—</div><div class="stat-lbl">Alerts today</div></div>
    <div class="stat"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">All time</div></div>
    <div class="stat"><div class="stat-val" id="s-countries">—</div><div class="stat-lbl">Countries</div></div>
  </div>
  <div class="header-right">
    <div class="live-pill"><div class="dot"></div><span id="last-upd">updating…</span></div>
    <a class="settings-btn" href="/settings">⚙ Settings</a>
  </div>
</header>

<div class="main">
  <div id="map"></div>
  <div class="sidebar">
    <div class="tabs">
      <div class="tab active" data-tab="aircraft">✈  Aircraft</div>
      <div class="tab" data-tab="iss">🛰️ ISS</div>
      <div class="tab" data-tab="history">📋 History</div>
      <div class="tab" data-tab="weather">☁  Weather</div>
      <div class="tab" data-tab="moon">🌙 Moon</div>
    </div>
    <div class="tab-pane active" id="pane-aircraft"></div>
    <div class="tab-pane" id="pane-iss"></div>
    <div class="tab-pane" id="pane-history"></div>
    <div class="tab-pane" id="pane-weather"></div>
    <div class="tab-pane" id="pane-moon"></div>
    <div class="src-bar" id="src-bar">
      <div class="src-item"><div class="src-dot" id="sd-opensky"></div><div class="src-info"><div class="src-name">OpenSky</div><div class="src-detail" id="st-opensky">—</div></div></div>
      <div class="src-item"><div class="src-dot" id="sd-iss"></div><div class="src-info"><div class="src-name">ISS</div><div class="src-detail" id="st-iss">—</div></div></div>
      <div class="src-item"><div class="src-dot" id="sd-weather"></div><div class="src-info"><div class="src-name">Weather</div><div class="src-detail" id="st-weather">—</div></div></div>
    </div>
  </div>
  <button class="sidebar-tab" id="sidebar-tab" title="Toggle sidebar">›</button>
</div>

<script>
const HOME_LAT   = {{ cfg.home_lat }};
const HOME_LON   = {{ cfg.home_lon }};
const RADIUS     = {{ cfg.radius_km }};
const ALT_THR    = {{ cfg.alt_threshold_ft }};
let USE_LOC_TZ = {{ 'true' if cfg.use_location_time else 'false' }};
let TIME_24H   = {{ 'true' if cfg.time_format == '24h' else 'false' }};
let locationTZ = '';

function _tz() { return (USE_LOC_TZ && locationTZ) ? locationTZ : undefined; }
function fmtTime(d) {
  const o = {hour: TIME_24H ? '2-digit' : 'numeric', minute:'2-digit', hour12: !TIME_24H};
  if (_tz()) o.timeZone = _tz();
  return d.toLocaleTimeString([], o);
}
function fmtDate(d) {
  const o = {weekday:'short', month:'short', day:'numeric'};
  if (_tz()) o.timeZone = _tz();
  return d.toLocaleDateString([], o);
}
function fmtDateTime(d) {
  const o = {month:'short', day:'numeric', hour: TIME_24H ? '2-digit' : 'numeric', minute:'2-digit', hour12: !TIME_24H};
  if (_tz()) o.timeZone = _tz();
  return d.toLocaleString([], o);
}
function fmtHourStr(s) {
  if (!s) return '';
  if (TIME_24H) return s;
  const [h, m] = s.split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', hour12:true});
}

// ── Map ───────────────────────────────────────────────────────────────────────
const map = L.map('map', {zoomControl:true}).setView([HOME_LAT, HOME_LON], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'© OpenStreetMap © CARTO', maxZoom:19
}).addTo(map);
L.circleMarker([HOME_LAT, HOME_LON], {radius:9,fillColor:'#4f7cff',color:'#fff',weight:2,fillOpacity:1})
  .addTo(map).bindPopup('<b>Home</b>');
const radiusCircle = L.circle([HOME_LAT, HOME_LON], {radius:RADIUS*1000, color:'#4f7cff',
  fillColor:'#4f7cff',fillOpacity:.04,weight:1,dashArray:'5 7'}).addTo(map);
map.fitBounds(radiusCircle.getBounds(), {padding:[40,40], animate:false});

const markers = {};
let historyData = [];
let ghostMarker = null;

function planeIcon(heading, alert) {
  const col = alert ? '#4f7cff' : '#f39c12';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
    <g transform="rotate(${heading},15,15)">
      <ellipse cx="15" cy="15" rx="2.5" ry="13" fill="${col}" fill-opacity=".9" stroke="rgba(255,255,255,.6)" stroke-width="1"/>
      <path d="M15,11 L2,21 L13,18.5 L17,18.5 L28,21 Z" fill="${col}" fill-opacity=".9" stroke="rgba(255,255,255,.5)" stroke-width=".5"/>
      <path d="M14,23.5 L8,29 L15,27 L22,29 L16,23.5 Z" fill="${col}" fill-opacity=".9" stroke="rgba(255,255,255,.5)" stroke-width=".5"/>
    </g></svg>`;
  return L.divIcon({html:svg, className:'', iconSize:[30,30], iconAnchor:[15,15]});
}

function ghostIcon() {
  const svg = `<svg class="ghost-plane" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 30 30">
    <ellipse cx="15" cy="15" rx="2.5" ry="13" fill="white" stroke="rgba(255,255,255,.3)" stroke-width="1"/>
    <path d="M15,11 L2,21 L13,18.5 L17,18.5 L28,21 Z" fill="white" stroke="rgba(255,255,255,.2)" stroke-width=".5"/>
    <path d="M14,23.5 L8,29 L15,27 L22,29 L16,23.5 Z" fill="white" stroke="rgba(255,255,255,.2)" stroke-width=".5"/>
  </svg>`;
  return L.divIcon({html:svg, className:'', iconSize:[36,36], iconAnchor:[18,18]});
}

function showHistoryPin(r) {
  if (ghostMarker) { map.removeLayer(ghostMarker); ghostMarker = null; }
  ghostMarker = L.marker([r.lat, r.lon], {icon: ghostIcon()})
    .addTo(map)
    .bindPopup(`<b>✈ ${r.callsign}</b><br><span style="color:#7b7f9e;font-size:11px">${r.model || 'Unknown'}</span>`)
    .openPopup();
  map.flyTo([r.lat, r.lon], 12);
}

function updateMap(aircraft) {
  const seen = new Set();
  for (const ac of aircraft) {
    seen.add(ac.icao24);
    const isAlert = ac.dist_km <= RADIUS && ac.alt_ft <= ALT_THR;
    const icon = planeIcon(ac.heading, isAlert);
    const vr = ac.vertical_rate;
    const vrStr = vr > .5 ? `↑${(Math.abs(vr)*196.85).toFixed(0)} fpm`
                : vr < -.5 ? `↓${(Math.abs(vr)*196.85).toFixed(0)} fpm` : 'level';
    const popup = `<b>${ac.callsign}</b>${ac.registration ? ' ('+ac.registration+')' : ''}<br>
      ${ac.model || 'Unknown'}<br>
      ${(ac.alt_ft||0).toLocaleString()} ft &bull; ${ac.speed_kts} kts &bull; ${vrStr}<br>
      ${ac.dist_km} km away &bull; ${ac.origin_country}`;
    if (markers[ac.icao24])
      markers[ac.icao24].setLatLng([ac.lat,ac.lon]).setIcon(icon).setPopupContent(popup);
    else
      markers[ac.icao24] = L.marker([ac.lat,ac.lon],{icon}).addTo(map).bindPopup(popup);
  }
  for (const id of Object.keys(markers)) {
    if (!seen.has(id)) { map.removeLayer(markers[id]); delete markers[id]; }
  }
}

// ── Sidebar rendering ─────────────────────────────────────────────────────────
function renderNearby(aircraft) {
  const el = document.getElementById('pane-aircraft');
  if (!aircraft.length) { el.innerHTML = '<div class="empty">No aircraft in range<br><small>Radius: '+RADIUS+' km · Alt ≤ '+ALT_THR.toLocaleString()+' ft</small></div>'; return; }
  el.innerHTML = aircraft.map(ac => {
    const isAlert = ac.dist_km <= RADIUS && ac.alt_ft <= ALT_THR;
    const vr = ac.vertical_rate;
    const vrStr = vr > .5 ? `↑ ${(Math.abs(vr)*196.85).toFixed(0)} fpm`
                : vr < -.5 ? `↓ ${(Math.abs(vr)*196.85).toFixed(0)} fpm` : '→ level';
    return `<div class="plane-card${isAlert?' alert':''}" onclick="map.flyTo([${ac.lat},${ac.lon}],13)">
      ${ac.photo_url ? `<img class="pc-photo" src="${ac.photo_url}" alt="${ac.callsign}" loading="lazy" onerror="this.style.display='none'">` : ''}
      <div class="pc-header"><span class="pc-call">✈ ${ac.callsign}</span><span class="pc-dist">${ac.dist_km} km</span></div>
      <div class="pc-model">${ac.model||'Unknown'}${ac.registration?' · '+ac.registration:''} · ${ac.origin_country}</div>
      <div class="pc-grid">
        <div class="pstat"><div class="pstat-val">${(ac.alt_ft||0).toLocaleString()}</div><div class="pstat-lbl">Feet</div></div>
        <div class="pstat"><div class="pstat-val">${ac.speed_kts}</div><div class="pstat-lbl">Knots</div></div>
        <div class="pstat"><div class="pstat-val" style="font-size:11px">${vrStr}</div><div class="pstat-lbl">V/S</div></div>
      </div>
    </div>`;
  }).join('');
}

function renderISS(passes) {
  const el = document.getElementById('pane-iss');
  if (!passes.length) { el.innerHTML = '<div class="empty">No upcoming ISS passes found<br><small>Check back later</small></div>'; return; }
  el.innerHTML = passes.map(p => {
    const dt  = new Date(p.pass_time * 1000);
    const timeStr = fmtTime(dt);
    const dateStr = fmtDate(dt);
    const soon = p.mins_away < 30;
    const countdownStr = p.mins_away < 60 ? p.mins_away+' min' : Math.round(p.mins_away/60)+'h';
    const durationStr  = p.duration >= 60
      ? Math.floor(p.duration/60)+'m '+(p.duration%60)+'s'
      : p.duration+'s';
    return `<div class="iss-card">
      <div class="iss-head">
        <span class="iss-title">🛰️ ISS Flyover &mdash; ${dateStr}</span>
        ${soon ? `<span class="iss-soon">In ${countdownStr}</span>` : ''}
      </div>
      <div class="iss-grid">
        <div class="pstat"><div class="pstat-val">${timeStr}</div><div class="pstat-lbl">Time</div></div>
        <div class="pstat"><div class="pstat-val">${countdownStr}</div><div class="pstat-lbl">From now</div></div>
        <div class="pstat"><div class="pstat-val">${durationStr}</div><div class="pstat-lbl">Duration</div></div>
        <div class="pstat"><div class="pstat-val">${p.start_az || '—'}</div><div class="pstat-lbl">Appears</div></div>
        <div class="pstat"><div class="pstat-val">${p.max_el != null ? p.max_el+'°' : '—'}</div><div class="pstat-lbl">Max height</div></div>
        <div class="pstat"><div class="pstat-val">${p.end_az || '—'}</div><div class="pstat-lbl">Disappears</div></div>
      </div>
    </div>`;
  }).join('');
}

function renderHistory(rows) {
  historyData = rows;
  const el = document.getElementById('pane-history');
  if (!rows.length) { el.innerHTML = '<div class="empty">No alerts yet<br><small>Alerts appear here once triggered</small></div>'; return; }
  el.innerHTML = rows.map((r, i) => {
    const dt = fmtDateTime(new Date(r.last_seen * 1000));
    const durMins = (r.last_seen - r.first_seen) > 60 ? ` · ${Math.round((r.last_seen - r.first_seen) / 60)}m` : '';
    const thumb = r.thumb_url
      ? `<img class="hc-thumb" src="${r.thumb_url}" alt="" loading="lazy" onclick="event.stopPropagation();openLightbox('${r.thumb_url}','${r.full_photo_url||''}')">`
      : '';
    const locLine = (r.lat && r.lon)
      ? `<a class="hc-loc" href="https://maps.google.com/?q=${r.lat.toFixed(4)},${r.lon.toFixed(4)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 ${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}</a>`
      : '';
    return `<div class="hist-card" data-idx="${i}">
      <div class="hc-top">
        ${thumb}
        <div class="hc-body">
          <div class="hc-row">
            <span class="hc-call">✈ ${r.callsign}</span>
            <span class="hc-time">${dt}</span>
          </div>
          <div class="hc-model">${r.model || 'Unknown type'}${r.registration ? ' · ' + r.registration : ''}${durMins}</div>
          <div class="hc-tags">
            ${r.origin_country ? `<span class="hc-tag">${r.origin_country}</span>` : ''}
            <span class="hc-tag">↕ ${(r.min_alt_ft||0).toLocaleString()} ft</span>
            <span class="hc-tag">⊙ ${r.min_dist_km} km</span>
          </div>
        </div>
      </div>
      ${locLine}
    </div>`;
  }).join('');
}

function openLightbox(thumbUrl, photoUrl) {
  document.getElementById('lb-img').src = thumbUrl;
  const credit = document.getElementById('lb-credit');
  credit.innerHTML = photoUrl ? `<a href="${photoUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">View on Planespotters.net ↗</a>` : '';
  document.getElementById('lb').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lb').classList.remove('open');
  document.getElementById('lb-img').src = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function windDir(deg) {
  return ['N','NE','E','SE','S','SW','W','NW'][Math.round((deg % 360) / 45) % 8];
}
function uvLabel(uv) {
  if (uv <= 2)  return ['Low',      '#2ecc71'];
  if (uv <= 5)  return ['Moderate', '#f1c40f'];
  if (uv <= 7)  return ['High',     '#e67e22'];
  if (uv <= 10) return ['V.High',   '#e74c3c'];
  return ['Extreme','#9b59b6'];
}
function wmoEmoji(code) {
  if (code === 0 || code === 1) return '☀️';
  if (code === 2) return '⛅';
  if (code === 3) return '☁️';
  if (code <= 48) return '🌫️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '❄️';
  if (code <= 82) return '🌦️';
  return '⛈️';
}

function renderWeather(cur, hourly, daily) {
  const el = document.getElementById('pane-weather');
  if (!cur || !cur.temp) { el.innerHTML = '<div class="empty">Weather loading…</div>'; return; }
  const [uvLbl, uvCol] = uvLabel(cur.uv_index || 0);
  const astroCol = cur.astronomy_color;
  const astroLbl = cur.astronomy_label;
  let html = `
  <div class="plane-card" style="border-left:3px solid ${astroCol}">
    <div class="pc-header"><span class="pc-call" style="font-size:20px">${wmoEmoji(cur.weather_code)} ${cur.description}</span></div>
    <div class="pc-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:8px">
      <div class="pstat"><div class="pstat-val">${cur.temp}°C</div><div class="pstat-lbl">Temp</div></div>
      <div class="pstat"><div class="pstat-val">${cur.feels_like}°C</div><div class="pstat-lbl">Feels like</div></div>
      <div class="pstat"><div class="pstat-val">${cur.humidity}%</div><div class="pstat-lbl">Humidity</div></div>
      <div class="pstat"><div class="pstat-val">${cur.wind_speed_kts}kt ${windDir(cur.wind_direction||0)}</div><div class="pstat-lbl">Wind</div></div>
      <div class="pstat"><div class="pstat-val" style="color:${uvCol}">${cur.uv_index} ${uvLbl}</div><div class="pstat-lbl">UV Index</div></div>
      <div class="pstat"><div class="pstat-val">${cur.cloud_cover_pct}%</div><div class="pstat-lbl">Cloud cover</div></div>
    </div>
    <div style="background:var(--surface);border-radius:6px;padding:8px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;color:var(--muted)">Sky visibility</span>
      <span style="font-weight:700;color:${astroCol}">${astroLbl} (${cur.astronomy_score}/100)</span>
    </div>
  </div>`;
  html += `<div style="font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px">Next 24 hours</div>
  <div style="overflow-x:auto;padding-bottom:6px"><div style="display:flex;gap:6px;min-width:max-content">`;
  (hourly||[]).slice(0,24).forEach(h => {
    const hTime = h.time ? h.time.split('T')[1] : '';
    html += `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 6px;text-align:center;min-width:54px">
      <div style="font-size:10px;color:var(--muted)">${fmtHourStr(hTime)}</div>
      <div style="font-size:16px;margin:3px 0">${wmoEmoji(h.weather_code)}</div>
      <div style="font-size:12px;font-weight:600">${h.temp}°</div>
      <div style="font-size:10px;color:#4f7cff">${h.precip_prob||0}%</div>
      <div style="font-size:10px;color:var(--muted)">${h.wind_kts}kt</div>
    </div>`;
  });
  html += `</div></div>`;
  html += `<div style="font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px">7-day forecast</div>`;
  (daily||[]).forEach(d => {
    const day = d.date ? new Date(d.date+'T00:00').toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}) : '';
    html += `<div class="hist-row">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:18px">${wmoEmoji(d.weather_code)}</span>
        <div><div class="hist-call">${day}</div><div class="hist-sub">${d.description}</div></div>
      </div>
      <div class="hist-meta">${d.temp_min}° – ${d.temp_max}°C<br>💧${d.precip_prob||0}% · ☁ ${d.astronomy_score}</div>
    </div>`;
  });
  el.innerHTML = html;
}

function renderMoon(moon) {
  const el = document.getElementById('pane-moon');
  if (!moon || !moon.phase_name) { el.innerHTML = '<div class="empty">Moon data loading…</div>'; return; }
  const nextFull = fmtDate(new Date(moon.next_full_moon * 1000));
  const nextNew  = fmtDate(new Date(moon.next_new_moon  * 1000));
  const pct = moon.illumination;
  const r = 54, cx = 70, cy = 70;
  const circumference = 2 * Math.PI * r;
  const dash = (pct / 100) * circumference;
  el.innerHTML = `
  <div class="plane-card" style="text-align:center;padding:20px">
    <div style="font-size:72px;line-height:1;margin-bottom:8px">${moon.phase_emoji}</div>
    <div style="font-size:18px;font-weight:700;margin-bottom:4px">${moon.phase_name}</div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:16px">${moon.illumination}% illuminated · ${moon.age_days} days old</div>
    <svg width="140" height="140" viewBox="0 0 140 140" style="margin:0 auto 16px;display:block">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="8"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f39c12" stroke-width="8"
        stroke-dasharray="${dash.toFixed(1)} ${circumference.toFixed(1)}"
        stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
        fill="var(--text)" font-size="18" font-weight="700">${pct}%</text>
    </svg>
  </div>
  <div class="plane-card">
    <div class="pc-grid" style="grid-template-columns:1fr 1fr">
      <div class="pstat"><div class="pstat-val" style="font-size:13px">${nextFull}</div><div class="pstat-lbl">Next full moon</div></div>
      <div class="pstat"><div class="pstat-val" style="font-size:13px">${nextNew}</div><div class="pstat-lbl">Next new moon</div></div>
      <div class="pstat"><div class="pstat-val">${moon.age_days}d</div><div class="pstat-lbl">Moon age</div></div>
      <div class="pstat"><div class="pstat-val">${(moon.fraction * 100).toFixed(0)}%</div><div class="pstat-lbl">Cycle complete</div></div>
    </div>
  </div>`;
}

// ── Source status bar ─────────────────────────────────────────────────────────
function agoStr(ts) {
  if (!ts) return 'never';
  const s = Math.floor(Date.now()/1000) - ts;
  if (s < 60)  return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

function renderStatus(rows) {
  const map = {};
  (rows||[]).forEach(r => map[r.source] = r);
  ['opensky','iss','weather'].forEach(src => {
    const r = map[src];
    const dot  = document.getElementById('sd-'+src);
    const lbl  = document.getElementById('st-'+src);
    if (!r) { dot.className='src-dot'; lbl.textContent='no data'; return; }
    dot.className = 'src-dot ' + r.status;
    if (r.status === 'ok') {
      lbl.textContent = agoStr(r.last_success);
    } else if (r.status === 'no_key') {
      lbl.textContent = 'no key';
    } else if (r.status === 'backoff') {
      const m = (r.detail||'').match(/(\d+)\s*min/);
      lbl.textContent = m ? `retry ${m[1]}m` : 'rate limited';
    } else {
      lbl.textContent = r.detail ? r.detail.slice(0,20) : 'error';
    }
  });
}

// ── Sidebar collapse ──────────────────────────────────────────────────────────
const sidebar    = document.querySelector('.sidebar');
const sidebarTab = document.getElementById('sidebar-tab');

sidebarTab.addEventListener('click', () => {
  const collapsed = sidebar.classList.toggle('collapsed');
  sidebarTab.textContent = collapsed ? '‹' : '›';
  setTimeout(() => map.invalidateSize(), 220);
});

if (window.innerWidth < 600) {
  sidebar.classList.add('collapsed');
  sidebarTab.textContent = '‹';
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('pane-'+t.dataset.tab).classList.add('active');
  });
});

// ── Single refresh function ───────────────────────────────────────────────────
async function refresh() {
  try {
    const [aircraft, iss, history, stats, cur, hourly, daily, moon, status] = await Promise.all([
      fetch('/api/live').then(r=>r.json()),
      fetch('/api/iss').then(r=>r.json()),
      fetch('/api/history').then(r=>r.json()),
      fetch('/api/stats').then(r=>r.json()),
      fetch('/api/weather/current').then(r=>r.json()),
      fetch('/api/weather/hourly').then(r=>r.json()),
      fetch('/api/weather/daily').then(r=>r.json()),
      fetch('/api/moon').then(r=>r.json()),
      fetch('/api/status').then(r=>r.json()),
    ]);
    if (cur && cur.timezone) locationTZ = cur.timezone;
    if (stats.use_location_time !== undefined) USE_LOC_TZ = stats.use_location_time;
    if (stats.time_format) TIME_24H = (stats.time_format === '24h');
    updateMap(aircraft);
    renderNearby(aircraft);
    renderISS(iss);
    renderHistory(history);
    renderWeather(cur, hourly, daily);
    renderMoon(moon);
    renderStatus(status);
    document.getElementById('s-live').textContent      = stats.live;
    document.getElementById('s-today').textContent     = stats.today;
    document.getElementById('s-total').textContent     = stats.total;
    document.getElementById('s-countries').textContent = stats.countries;
    document.getElementById('last-upd').textContent    = fmtTime(new Date());
  } catch(e) { console.error('Refresh error:', e); }
}

document.getElementById('pane-history').addEventListener('click', e => {
  const card = e.target.closest('.hist-card');
  if (!card) return;
  const r = historyData[+card.dataset.idx];
  if (r && r.lat && r.lon) showHistoryPin(r);
});

refresh();
setInterval(refresh, 15000);
</script>
