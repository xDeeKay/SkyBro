<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkyBro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3248;
  --text:#e2e4f0;--muted:#7b7f9e;--accent:#4f7cff;
  --green:#2ecc71;--amber:#f39c12;--red:#e74c3c;--teal:#1abc9c;
  --font:system-ui,-apple-system,sans-serif;
  --sidebar-w:clamp(300px,32vw,420px);
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;position:relative}
.logo{font-size:17px;font-weight:700;letter-spacing:-0.3px;white-space:nowrap;text-decoration:none;color:inherit;cursor:pointer}.logo span{color:var(--accent)}
.logo-loc{font-size:11px;line-height:13px;min-height:13px;color:var(--muted);letter-spacing:.2px;margin-top:2px;white-space:nowrap}
.hdr-stats{display:flex;gap:12px;align-items:center;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.hdr-sep{width:1px;height:28px;background:var(--border);flex-shrink:0}
.stat{text-align:center;white-space:nowrap}.stat-val{font-size:17px;font-weight:700;color:var(--accent);line-height:1}.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-clock{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:var(--muted);white-space:nowrap}.hdr-clock-sep{font-size:13px;color:var(--border)}
.settings-btn{color:var(--muted);font-size:17px;font-weight:700;text-decoration:none;cursor:pointer;transition:color .15s}
.settings-btn:hover{color:var(--text)}
@media (max-width:800px){.hdr-ctx{display:none!important}}
@media (max-width:480px){
  header{flex-wrap:wrap;row-gap:6px}
  .hdr-brand{display:contents}
  .logo{order:1}
  .hdr-right{order:2}
  .logo-loc{order:3;flex-basis:100%;max-width:none;overflow:visible;text-overflow:clip;white-space:normal}
  .hdr-stats{position:static;transform:none;order:4;flex-basis:100%;justify-content:space-around}
  .hdr-ctx{display:inline!important}
  .hdr-clock{font-size:14px;gap:5px}
}
.main{display:flex;flex:1;overflow:hidden;position:relative}
#map{flex:1;min-width:0;position:relative;z-index:0;background:#090909}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transition:width .2s ease;position:relative}
.sidebar.collapsed{width:0;min-width:0;border:none}
.sidebar-tab{position:absolute;right:var(--sidebar-w);top:50%;transform:translateY(-50%);width:18px;height:44px;background:var(--surface);border:1px solid var(--border);border-right:none;border-radius:6px 0 0 6px;cursor:pointer;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;z-index:500;transition:right .2s ease;padding:0;line-height:1;user-select:none}
.sidebar-tab:hover{color:var(--text);background:var(--surface2)}
.sidebar.collapsed~.sidebar-tab{right:0}
.tabs{display:flex;justify-content:center;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{min-width:max-content;padding:8px 10px;text-align:center;cursor:pointer;color:var(--muted);font-size:11px;font-weight:500;line-height:1;border-bottom:2px solid transparent;transition:all .15s;user-select:none;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text)}
.tab-pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;will-change:transform;padding:12px;display:none}
.tab-pane.active{display:block}
.plane-card{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.plane-card:not(.alert):hover{border-top-color:var(--amber);border-right-color:var(--amber);border-bottom-color:var(--amber)}
.plane-card.alert:hover{border-top-color:var(--accent);border-right-color:var(--accent);border-bottom-color:var(--accent)}
.wx-summary-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 12px;margin-bottom:8px;transition:border-color .15s}
.wx-summary-card:hover{border-top-color:var(--wx-accent);border-right-color:var(--wx-accent);border-bottom-color:var(--wx-accent)}
.plane-card.alert{border-left:3px solid var(--accent)}
.pc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.pc-call{font-weight:700;font-size:14px}.pc-dist{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:2px 7px;font-size:11px;color:var(--muted)}
.pc-model{color:var(--muted);font-size:11px;margin-bottom:8px}
.pc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pstat{background:var(--surface);border-radius:5px;padding:5px 7px}
.pstat-val{font-weight:600;font-size:12px}.pstat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase}
.iss-card{background:var(--surface2);border:1px solid var(--teal);border-radius:8px;padding:12px;margin-bottom:8px}
.iss-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.iss-title{font-weight:700;color:var(--teal);font-size:14px}
.iss-soon{background:var(--teal);color:#000;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700}
.iss-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.hist-call{font-weight:600;font-size:13px}
.hist-sub{font-size:11px;color:var(--muted);margin-top:2px}
.hist-meta{text-align:right;font-size:11px;color:var(--muted)}
.hist-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.hist-card:hover{border-color:var(--accent)}
.hist-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hc-top{display:flex;gap:9px;align-items:flex-start}
.hc-thumb{width:70px;height:52px;object-fit:cover;border-radius:5px;flex-shrink:0;cursor:pointer;transition:opacity .15s}
.hc-thumb:hover{opacity:.75}
.hc-body{flex:1;min-width:0}
.hc-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.hc-call{font-weight:700;font-size:13px}
.hc-time{font-size:10px;color:var(--muted);white-space:nowrap;padding-left:6px}
.hc-model{font-size:11px;color:var(--muted);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc-tags{display:flex;flex-wrap:wrap;gap:3px}
.hc-tag{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:10px;color:var(--muted)}
.hc-loc{display:inline-block;font-size:10px;color:var(--accent);text-decoration:none}
.hc-loc-row{margin-top:7px;padding-top:6px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:6px}
.hc-loc:hover{text-decoration:underline}
.hc-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.fav-btn{background:none;border:none;cursor:pointer;font-size:11px;padding:2px;opacity:.3;transition:opacity .15s;line-height:1;flex-shrink:0}
.fav-btn.active,.fav-btn:hover{opacity:1}
.seen-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:2px;line-height:1;flex-shrink:0;opacity:.3;transition:opacity .15s}
.seen-btn.active,.seen-btn:hover{opacity:1}
.del-btn{background:none;border:none;cursor:pointer;font-size:11px;padding:2px;opacity:.25;transition:opacity .15s,text-shadow .15s;line-height:1;flex-shrink:0}
.del-btn:hover{opacity:1;text-shadow:0 0 1px var(--red),0 0 2px var(--red),0 0 2px var(--red)}
.fav-filter-btn,.seen-filter-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:13px;transition:border-color .15s,background .15s;flex-shrink:0}
.fav-filter-btn.active{background:rgba(243,156,18,.15);border-color:var(--amber)}
.seen-filter-btn.active{background:rgba(59,158,255,.15);border-color:#3b9eff}
.fav-filter-btn:hover:not(.active),.seen-filter-btn:hover:not(.active){border-color:var(--accent)}
.load-more-btn{display:block;width:100%;padding:9px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:13px;cursor:pointer;margin-top:8px;transition:border-color .15s,color .15s}
.load-more-btn:hover{border-color:var(--accent);color:var(--text)}
.stats-section-hdr{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.sec-hdr{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.stats-section-hdr:first-child{margin-top:2px}
.stats-overview{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:2px}
.stats-tile{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 8px;text-align:center}
.stats-tile-val{font-size:22px;font-weight:700;color:var(--accent);line-height:1}
.stats-tile-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.stats-records{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats-rec{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 10px 8px;min-width:0}
.stats-rec-val{font-size:15px;font-weight:700;color:var(--text);line-height:1.2}
.stats-rec-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.stats-rec-sub{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.bar-label{font-size:11px;color:var(--text);width:100px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:var(--surface2);border-radius:3px;height:5px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:3px;opacity:.8}
.bar-count{font-size:10px;color:var(--muted);width:24px;flex-shrink:0;text-align:right}
.hour-chart-wrap{position:relative}
.hour-tip{position:absolute;bottom:calc(100% + 5px);background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:11px;padding:3px 8px;border-radius:5px;pointer-events:none;white-space:nowrap;display:none;transform:translateX(-50%);z-index:20}
.hour-chart{display:flex;align-items:flex-end;gap:2px;height:44px}
.hour-bar{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.65;transition:opacity .1s;cursor:pointer}
.hour-bar:hover,.hour-bar.active{opacity:1}
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9998;align-items:center;justify-content:center}
.confirm-overlay.open{display:flex}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px 24px;max-width:300px;width:90%;text-align:center}
.confirm-box p{font-size:14px;margin-bottom:18px;line-height:1.5}
.confirm-actions{display:flex;gap:8px;justify-content:center}
.confirm-ok{background:var(--red);border:none;color:#fff;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.confirm-ok.neutral{background:var(--accent)}
.confirm-ok:hover{opacity:.85}
.confirm-cancel{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;transition:border-color .15s}
.confirm-cancel:hover{border-color:var(--accent)}
.first-run-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9998;align-items:center;justify-content:center}
.frm-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px 24px;max-width:360px;width:90%;text-align:center}
.frm-box p{font-size:14px;margin-bottom:18px;line-height:1.5}
.frm-actions{display:flex;gap:8px;justify-content:center}
.frm-actions button{padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;transition:opacity .15s,border-color .15s}
#frm-ok{background:var(--accent);border:none;color:#fff;font-weight:600}
#frm-ok:hover{opacity:.85}
#frm-settings{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
#frm-settings:hover{border-color:var(--accent)}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;gap:12px}
.lb.open{display:flex}
.lb img{max-width:90vw;max-height:80vh;max-height:80dvh;border-radius:8px;object-fit:contain;cursor:default}
.lb-close{position:absolute;top:14px;right:18px;color:#fff;font-size:26px;line-height:1;opacity:.6;cursor:pointer}
.lb-close:hover{opacity:1}
.lb-credit{font-size:11px;color:rgba(255,255,255,.45)}
.lb-credit a{color:rgba(255,255,255,.65);text-decoration:none}
.lb-credit a:hover{text-decoration:underline}
@keyframes ghost-pulse{0%,100%{opacity:.55}50%{opacity:.2}}
.ghost-plane{animation:ghost-pulse 2s ease-in-out infinite}
.sub-tabs{display:none}
.sub-tab{padding:8px 10px;font-size:11px;font-weight:500;line-height:1;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;user-select:none;transition:all .15s}
.sub-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.sub-tab:hover:not(.active){color:var(--text)}
.sub-filter{display:flex;gap:4px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.astro-topbar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px;z-index:10;margin:-12px -12px 8px}
.astro-search{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 9px;color:var(--text);font-size:12px;outline:none}
.astro-search:focus{border-color:var(--accent)}
.a-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:5px;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.a-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.a-horizon{margin-left:auto}
.astro-tonight{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.at-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px;font-size:11px}
.at-row:last-child{margin-bottom:0}
.at-lbl{color:var(--muted);flex-shrink:0;white-space:nowrap}
.at-val{text-align:right;font-weight:500;font-size:11px}
.at-hi{margin-top:8px;padding-top:7px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.astro-sec{margin-bottom:2px}
.astro-sec-hdr{cursor:pointer;padding:9px 4px 5px;display:flex;justify-content:space-between;align-items:center;user-select:none;border-bottom:1px solid var(--border)}
.astro-sec-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.astro-sec-badge{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1px 7px;font-size:10px;font-weight:600;color:var(--text);text-transform:none;letter-spacing:0}
.astro-sec-chev{font-size:13px;color:var(--muted)}
.astro-sec-body{padding-top:4px}
.a-count{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:1px 6px;font-size:10px;font-weight:600;color:var(--text)}
.astro-card{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin-bottom:5px}
.ac-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.ac-name{font-weight:600;font-size:12px}
.ac-right{font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px}
.ac-meta{font-size:10px;color:var(--muted);margin-bottom:2px}
.ac-time{font-size:10px;color:var(--muted)}
.ac-note{font-size:10px;color:var(--amber);margin-bottom:2px}
.a-badge{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.a-badge.live{background:rgba(46,204,113,.15);border-color:var(--green);color:var(--green)}
.astro-empty{color:var(--muted);font-size:12px;padding:8px 0;text-align:center}
.astro-moon{padding:4px 0 6px}
.ac-grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.ac-g2-item{background:var(--surface);border-radius:4px;padding:5px 7px;font-size:10px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:32px 16px;font-size:13px;line-height:1.6}
.src-bar{display:flex;gap:0;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.back-top{position:absolute;top:82px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-top:4px;opacity:0;pointer-events:none;transition:opacity .2s,background .15s;z-index:50}
.back-top.visible{opacity:1;pointer-events:auto}
.back-top:hover{background:var(--muted)}
.src-item{flex:1;display:flex;align-items:center;gap:5px;padding:6px 8px;font-size:11px;color:var(--muted);min-width:0;border-right:1px solid var(--border);position:relative}
.src-item:last-child{border-right:none}
.src-item[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:0;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:11px;line-height:1.4;padding:5px 9px;border-radius:6px;width:220px;white-space:normal;z-index:200;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.src-item::before{content:'';position:absolute;top:0;left:0;border-style:solid;border-width:7px 7px 0 0;border-color:var(--border) transparent transparent transparent}
.src-item.ok::before{border-top-color:var(--green)}
.src-item.error::before{border-top-color:var(--red)}
.src-item.backoff::before,.src-item.no_key::before{border-top-color:var(--amber)}
.src-info{min-width:0;overflow:hidden;flex:1;text-align:center}
.src-name{font-weight:600;white-space:nowrap}.src-detail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.pc-photo{width:100%;height:80px;object-fit:cover;border-radius:5px;margin-bottom:7px;display:block}
/* Sky timeline bar */
.sky-bar{height:22px;border-radius:5px;overflow:hidden;position:relative;background:#050b1e;border:1px solid var(--border);margin:4px 0 2px}
.sky-seg{position:absolute;top:0;height:100%}
.sky-now-line{position:absolute;top:0;width:2px;height:100%;background:rgba(255,255,255,.75);border-radius:1px}
/* Tonight metric grid */
.at-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.at-metric{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.at-metric-icon{font-size:16px;margin-bottom:5px;line-height:1}
.at-metric-val{font-weight:700;font-size:12px;line-height:1.3;margin-bottom:1px}
.at-metric-sub{font-size:10px;color:var(--muted)}
/* Moon hero */
.moon-hero{text-align:center;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:12px}
.moon-big-emoji{font-size:52px;line-height:1;margin-bottom:8px}
.moon-big-pct{font-size:30px;font-weight:700;line-height:1;margin-bottom:3px}
.moon-big-name{font-size:14px;font-weight:600;margin-bottom:2px}
.moon-big-sub{font-size:11px;color:var(--muted);margin-bottom:4px}

<script>
const HOME_LAT   = {{ cfg.home_lat }};

const UNITS_SPEED = '{{ cfg.units_speed }}';
const UNITS_TEMP  = '{{ cfg.units_temp }}';
const APP_VERSION = '{{ app_version }}';
const GIT_SHA     = '{{ git_sha }}';
let locationTZ = '';

function _tz() { return (USE_LOC_TZ && locationTZ) ? locationTZ : undefined; }
function fmtTime(d) {
  const o = {hour: TIME_24H ? '2-digit' : 'numeric', minute:'2-digit', hour12: !TIME_24H};
  if (_tz()) o.timeZone = _tz();
  return d.toLocaleTimeString([], o);
}
function fmtDate(d) {
  const o = {weekday:'short', month:'short', day:'numeric'};
  if (_tz()) o.timeZone = _tz();
  return d.toLocaleDateString([], o);
}
function fmtDateTime(d) {
  const o = {month:'short', day:'numeric', hour: TIME_24H ? '2-digit' : 'numeric', minute:'2-digit', hour12: !TIME_24H};
  if (_tz()) o.timeZone = _tz();
  return d.toLocaleString([], o);
}
function fmtHourStr(s) {
  if (!s) return '';
  if (TIME_24H) return s;
  const [h, m] = s.split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', hour12:true});
}

function fmtAlt(ft) {
  if (UNITS_SPEED === 'metric') return Math.round(ft * 0.3048).toLocaleString() + ' m';
  return Math.round(ft).toLocaleString() + ' ft';
}
function fmtSpeed(kts) {
  if (UNITS_SPEED === 'metric') return Math.round(kts * 1.852) + ' km/h';
  return kts + ' kts';
}
function fmtTemp(c) {
  if (UNITS_TEMP === 'metric') return c + '°C';
  return ((c * 9/5) + 32).toFixed(1) + '°F';
}
function fmtTempBare(c) {
  if (UNITS_TEMP === 'metric') return c + '°';
  return Math.round(c * 9/5 + 32) + '°';
}
function fmtVR(ms) {
  if (Math.abs(ms) <= 0.5) return '→ level';
  const up = ms > 0;
  if (UNITS_SPEED === 'metric') return (up ? '↑ ' : '↓ ') + Math.round(Math.abs(ms * 60)) + ' m/min';
  return (up ? '↑ ' : '↓ ') + Math.round(Math.abs(ms * 196.85)) + ' fpm';
}

// layer gets one flat color rather than a per-zoom translation: the two renderers
// don't share zoom-stop breakpoints, so matching them stop-for-stop wouldn't mean
// anything anyway.
function loadDarkMatterStyle() {

// Detects iOS regardless of "Request Desktop Website" UA/platform spoofing:
// navigator.standalone is a property only iOS's WebKit exposes at all.
const IS_IOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
  typeof navigator.standalone !== 'undefined';

// @maplibre/maplibre-gl-leaflet syncs its WebGL canvas to Leaflet's view on
// every Leaflet 'zoom' event, and Leaflet fires 'zoom' on every
// requestAnimationFrame tick during a live pinch gesture (Map.js's _move():
// "Always fire 'zoom' if pinching because #3530"), independent of any
// animation setting - throttling that per-frame repaint (below) cuts how
// often it happens, but a Retina iPad's WebGL canvas is still being asked to
// fully reproject and repaint this style's ~80 layers at up to 3x device
// pixel density on every one of those repaints. That per-frame GPU/fill-rate
// cost, not repaint frequency alone, is what's been freezing real iPad
// hardware after two frequency-only fixes didn't help. MapLibre GL has a
// pixelRatio option built for exactly this: capping it to 1 on iOS renders
// at standard (non-Retina) resolution, cutting GPU fill-rate/memory load per
// frame by 4-9x depending on the device, at the cost of a softer-looking
// basemap on iOS specifically.
// Temporary diagnostic only, not a real feature: ?nobasemap in the URL skips
// the vector layer entirely (plain background, markers/circles still work),
// to bisect whether MapLibre GL's WebGL rendering is actually what's freezing
// iOS Safari on pinch-zoom, versus something else in the page. Remove once
// that's confirmed one way or the other.
function addVectorBasemap(m) {
  if (new URLSearchParams(location.search).has('nobasemap')) return;
  loadDarkMatterStyle().then(style => {
    const glLayer = L.maplibreGL(IS_IOS ? { style, pixelRatio: 1 } : { style });
    glLayer._pinchZoom = L.Util.throttle(glLayer._pinchZoom, 100, glLayer);
    glLayer.addTo(m);
  }).catch(e => console.error('Basemap failed to load, falling back to plain background:', e));
}

const markers = {};

let _sourceStatus = {};

function _acEmoji(category, callsign, model) {
  return aircraftType(model, category, callsign) === 'heli' ? '🚁' : '✈️';
}

function aircraftType(model, category, callsign) {
  // ADS-B category is authoritative when set (non-zero)
  if (category === 8) return 'heli';
  if (category === 6) return 'widebody'; // Heavy (>300k lbs) = widebody in practice
  // Callsign hints for legacy/unknown-model entries
  if ((!model || model === 'Unknown') && callsign) {
    const cs = callsign.toUpperCase();
    if (/^(RSCU|TIGR|HEMS|LIFEF|HELIAIR|POLAIR|NGAIR|CHC|PHG)/.test(cs)) return 'heli';
    return 'jet';
  }
  if (!model || model === 'Unknown') return 'jet';
  const m = model.toLowerCase();
  if (/helicopt|eurocopter|sikorsky|robinson|airbus h|leonardo|bell \d|ec\d{3}|h130|h145|h160|aw\d{3}|r22|r44|r66|bo.?105|bk.?117|ka-\d|mi-\d/.test(m)) return 'heli';
  if (/b74\d|b76\d|b77\d|b78\d|747|767|777|787|a33\d|a34\d|a35\d|a380|dc-10|md-11|dreamliner/.test(m)) return 'widebody';
  if (/\bf-\d|f\/a-|eurofighter|typhoon|gripen|rafale|hornet|b-52|c-17|c-130|hercules|harrier|su-\d|mig-\d|pc.?21|p-8a|poseidon|globemaster|wedgetail/.test(m)) return 'military';
  if (/cessna|piper|beechcraft|cirrus sr|diamond da|tecnam|c172|c152|c182|pa-\d|da2\d|da4\d|sr2\d|tbm |pc-12|pc-6|robin/.test(m)) return 'light';
  return 'jet';
}

function _planeSVG(col, type) {
  const fb = `fill="${col}" fill-opacity=".9" stroke="rgba(255,255,255,.6)" stroke-width="1"`;
  const fs = `fill="${col}" fill-opacity=".9" stroke="rgba(255,255,255,.5)" stroke-width=".5"`;
  const fh = `fill="${col}" fill-opacity=".9"`;
  switch (type) {
    case 'widebody': return `
      <ellipse cx="15" cy="14" rx="3" ry="12" ${fb}/>
      <path d="M15,9 L1,21 L13,17.5 L17,17.5 L29,21 Z" ${fs}/>
      <path d="M13,24 L5,28.5 L15,27 L25,28.5 L17,24 Z" ${fs}/>`;
    case 'heli': return `
      <rect x="0" y="9.5" width="30" height="3" rx="1.5" fill="${col}" fill-opacity=".9" transform="rotate(45 15 11)"/>
      <rect x="0" y="9.5" width="30" height="3" rx="1.5" fill="${col}" fill-opacity=".9" transform="rotate(-45 15 11)"/>
      <ellipse cx="15" cy="14" rx="3" ry="10" ${fh}/>
      <rect x="13.5" y="22" width="3" height="5" fill="${col}"/>
      <rect x="11" y="26.5" width="8" height="2" rx="1" fill="${col}" fill-opacity=".85"/>
      <rect x="12.5" y="9" width="5" height="4" rx="1" fill="${col}"/>`;
    case 'light': return `
      <ellipse cx="15" cy="17" rx="2.2" ry="8.5" ${fb}/>
      <ellipse cx="15" cy="7" rx="5.5" ry="1.5" fill="${col}" fill-opacity=".8"/>
      <path d="M13,13.5 L5,15 L5,17.5 L13,17 L17,17 L25,17.5 L25,15 L17,13.5 Z" ${fs}/>
      <path d="M13,24 L9,27 L15,25.5 L21,27 L17,24 Z" ${fh}/>`;
    case 'military': return `
      <ellipse cx="15" cy="13" rx="1.8" ry="12" ${fb}/>
      <path d="M15,5 L3,26 L14,21 L16,21 L27,26 Z" ${fs}/>
      <path d="M13,22 L10.5,28.5 L14.5,26 Z" fill="${col}" fill-opacity=".85"/>
      <path d="M17,22 L19.5,28.5 L15.5,26 Z" fill="${col}" fill-opacity=".85"/>`;
    default: return `
      <ellipse cx="15" cy="14" rx="2" ry="12" ${fb}/>
      <path d="M15,10 L4,20 L13,17.5 L17,17.5 L26,20 Z" ${fs}/>
      <path d="M13,24.5 L8,28 L15,26.5 L22,28 L17,24.5 Z" ${fs}/>`;
  }
}

function planeIcon(heading, alert, type) {
  const col = alert ? '#4f7cff' : '#f39c12';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
    <g transform="rotate(${heading||0},15,15)">${_planeSVG(col, type||'jet')}</g></svg>`;
  return L.divIcon({html:svg, className:'', iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-18]});
}

function ghostIcon(heading, type) {
  const svg = `<svg class="ghost-plane" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 30 30">
    <g transform="rotate(${heading||0},15,15)">${_planeSVG('white', type||'jet')}</g>
  </svg>`;
  return L.divIcon({html:svg, className:'', iconSize:[36,36], iconAnchor:[18,18], popupAnchor:[0,-21]});
}

function clearGhostPath() {
  _ghostToken++;
  ghostMarkers.forEach(m => map.removeLayer(m));
  ghostMarkers = [];
  if (ghostPath) { map.removeLayer(ghostPath); ghostPath = null; }
  _selectedHistId = null;
  document.querySelectorAll('.hist-card.selected').forEach(el => el.classList.remove('selected'));
}

function _project(lat, lon, bearingDeg, distKm) {
  const R = 6371, d = distKm / R, b = bearingDeg * Math.PI / 180;
  const φ1 = lat * Math.PI / 180, λ1 = lon * Math.PI / 180;
  const φ2 = Math.asin(Math.sin(φ1)*Math.cos(d) + Math.cos(φ1)*Math.sin(d)*Math.cos(b));
  const λ2 = λ1 + Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(φ1), Math.cos(d)-Math.sin(φ1)*Math.sin(φ2));
  return [φ2*180/Math.PI, λ2*180/Math.PI];
}

function _catmullRom(pts, segs = 10, p0 = null, pN = null) {
  if (pts.length < 2) return pts;
  const p = [p0 || pts[0], ...pts, pN || pts[pts.length - 1]];
  const out = [];
  for (let i = 1; i < p.length - 2; i++) {
    for (let s = 0; s < segs; s++) {
      const t = s / segs, t2 = t * t, t3 = t2 * t;
      const q0 = -t3 + 2*t2 - t, q1 = 3*t3 - 5*t2 + 2, q2 = -3*t3 + 4*t2 + t, q3 = t3 - t2;
      out.push([
        0.5*(p[i-1][0]*q0 + p[i][0]*q1 + p[i+1][0]*q2 + p[i+2][0]*q3),
        0.5*(p[i-1][1]*q0 + p[i][1]*q1 + p[i+1][1]*q2 + p[i+2][1]*q3)
      ]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}

async function showHistoryPin(r) {
  const token = ++_ghostToken;
  const type = aircraftType(r.model, r.category, r.callsign);
  const pings = r.id
    ? await fetch(`/api/history/${r.id}/pings`).then(res => res.json()).catch(() => [])
    : [];

  if (token !== _ghostToken) return;

  if (pings.length > 0) {
    const latlngs = pings.map(p => [p.lat, p.lon]);
    const extKm = p => (p.speed_kts || 250) * 1.852 / 240;
    const fp = pings[0], lp = pings[pings.length - 1];
    const havsKm = (a, b) => {
      const R = 6371, φ1 = a.lat*Math.PI/180, φ2 = b.lat*Math.PI/180;
      const dφ = (b.lat-a.lat)*Math.PI/180, dλ = (b.lon-a.lon)*Math.PI/180;
      const s = Math.sin(dφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(dλ/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
    };
    const d01 = pings.length > 1 ? havsKm(pings[0], pings[1]) : extKm(fp);
    const dN  = pings.length > 1 ? havsKm(pings[pings.length-2], pings[pings.length-1]) : extKm(lp);
    const phantomFirst = _project(fp.lat, fp.lon, (fp.heading + 180) % 360, d01);
    const phantomLast  = _project(lp.lat, lp.lon, lp.heading, dN);
    const curved = _catmullRom(latlngs, 10, phantomFirst, phantomLast);
    ghostPath = L.polyline(curved, {color: 'rgba(255,255,255,0.3)', weight: 2, dashArray: '5 7'}).addTo(map);
    pings.forEach(p => {
      ghostMarkers.push(L.marker([p.lat, p.lon], {icon: ghostIcon(p.heading, type)}).addTo(map));
    });
    const extStyle = {color: 'rgba(255,255,255,0.18)', weight: 2, dashArray: '3 9'};
    ghostMarkers.push(
      L.polyline([_project(fp.lat, fp.lon, (fp.heading + 180) % 360, extKm(fp)), [fp.lat, fp.lon]], extStyle).addTo(map),
      L.polyline([[lp.lat, lp.lon], _project(lp.lat, lp.lon, lp.heading, extKm(lp))], extStyle).addTo(map)
    );
    if (pings.length > 1) {
      map.flyToBounds(L.latLngBounds(latlngs), {padding: [50, 50], maxZoom: 15});
    } else {
      map.flyTo([r.lat, r.lon], 13);
    }
  } else {
    ghostMarkers.push(L.marker([r.lat, r.lon], {icon: ghostIcon(r.heading, type)}).addTo(map));
    map.flyTo([r.lat, r.lon], Math.max(map.getZoom(), 12));
  }
}

function updateMap(aircraft) {
  const seen = new Set();
  for (const ac of aircraft) {
    seen.add(ac.icao24);
    const isAlert = ac.dist_km <= RADIUS && ac.alt_ft <= ALT_THR;
    const icon = planeIcon(ac.heading, isAlert, aircraftType(ac.model, ac.category, ac.callsign));
    const vr = ac.vertical_rate;
    const vrStr = fmtVR(vr);
    const popup = `<b>${ac.callsign}</b>${ac.registration ? ' ('+ac.registration+')' : ''}<br>
      ${ac.model || 'Unknown'}<br>
      ${fmtAlt(ac.alt_ft||0)} &bull; ${fmtSpeed(ac.speed_kts)} &bull; ${vrStr}<br>
      ${ac.dist_km} km away &bull; ${ac.origin_country}`;
    if (markers[ac.icao24])
      markers[ac.icao24].setLatLng([ac.lat,ac.lon]).setIcon(icon).setPopupContent(popup);
    else
      markers[ac.icao24] = L.marker([ac.lat,ac.lon],{icon}).addTo(map).bindPopup(popup);
  }
  for (const id of Object.keys(markers)) {
    if (!seen.has(id)) { map.removeLayer(markers[id]); delete markers[id]; }
  }
}

function _histCardHtml(r, i) {
  const dt = fmtDateTime(new Date(r.last_seen * 1000));
  const durMins = (r.last_seen - r.first_seen) > 60 ? ` · ${Math.round((r.last_seen - r.first_seen) / 60)}m` : '';

    ? `<img class="hc-thumb" src="${r.thumb_url}" alt="" decoding="async" onclick="event.stopPropagation();openLightbox('${r.thumb_url}','${r.full_photo_url||''}')">`
    : '';
  const locAnchor = (r.lat && r.lon)
    ? `<a class="hc-loc" href="https://maps.google.com/?q=${r.lat.toFixed(4)},${r.lon.toFixed(4)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 ${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}</a>`
    : `<span></span>`;
  return `<div class="hist-card" data-id="${r.id}">
    <div class="hc-top">
      ${thumb}
      <div class="hc-body">
        <div class="hc-row">
          <span class="hc-call">${_acEmoji(r.category, r.callsign, r.model)} ${r.callsign}</span>
          <span class="hc-time">${dt}</span>
        </div>
        <div class="hc-model">${r.model || 'Unknown type'}${r.registration ? ' · ' + r.registration : ''}${durMins}</div>
        <div class="hc-tags">
          ${r.origin_country ? `<span class="hc-tag">${r.origin_country}</span>` : ''}
          <span class="hc-tag">↕ ${fmtAlt(r.min_alt_ft||0)}</span>
          <span class="hc-tag">⊙ ${r.min_dist_km} km</span>
          ${r.speed_kts ? `<span class="hc-tag">➜ ${fmtSpeed(r.speed_kts)}</span>` : ''}
          ${Math.abs(r.vertical_rate||0) > 0.5 ? `<span class="hc-tag">${fmtVR(r.vertical_rate)}</span>` : ''}
        </div>
      </div>
    </div>
    <div class="hc-loc-row">
      ${locAnchor}
      <span class="hc-actions">
        <button class="fav-btn${r.favourited?' active':''}" onclick="event.stopPropagation();toggleFav(${r.id},${i})" title="${r.favourited?'Unfavourite':'Favourite'}">⭐</button>
        <button class="seen-btn${r.seen?' active':''}" onclick="event.stopPropagation();toggleSeen(${r.id},${i})" title="${r.seen?'Mark as unseen':'Mark as seen'}">👁️</button>
        <button class="del-btn" onclick="event.stopPropagation();deleteHistEntry(${r.id},${i})" title="Delete">🗑️</button>
      </span>
    </div>
  </div>`;
}

function _drawAircraft() {
  const el = document.getElementById('pane-aircraft');
  const subEl = document.getElementById('sidebar-sub-tabs');

  const tabsHtml = [['live','✈️ Live'],['history','📋 History'],['stats','📊 Stats']].map(([id,lbl]) =>
    `<div class="sub-tab${_aircraftTab===id?' active':''}" onclick="switchAircraftTab('${id}')">${lbl}</div>`
  ).join('');
  if (el.classList.contains('active')) { subEl.innerHTML = tabsHtml; subEl.style.display = ''; }

  if (_aircraftTab === 'stats') { _drawStats(); return; }
  if (_aircraftTab === 'live') {
    if (!_liveAircraft.length) {
      const os = _sourceStatus.opensky;
      if (os && os.status === 'error') {
        el.innerHTML = '<div class="empty">Aircraft data unavailable<br><small>OpenSky Network isn\'t responding. Check again shortly.</small></div>';
      } else if (os && os.status === 'backoff') {
        el.innerHTML = '<div class="empty">Rate limited by OpenSky<br><small>Retrying automatically.</small></div>';
      } else {
        el.innerHTML = '<div class="empty">No aircraft in range<br><small>Radius: '+RADIUS+' km · Alt ≤ '+fmtAlt(ALT_THR)+'</small></div>';
      }
      return;
    }
    el.innerHTML = _liveAircraft.map(ac => {
      const isAlert = ac.dist_km <= RADIUS && ac.alt_ft <= ALT_THR;
      const vr = ac.vertical_rate;
      const vrStr = fmtVR(vr);
      return `<div class="plane-card${isAlert?' alert':''}" onclick="map.flyTo([${ac.lat},${ac.lon}],13)">
        ${ac.photo_url ? `<img class="pc-photo" src="${ac.photo_url}" alt="${ac.callsign}" decoding="async" onerror="this.style.display='none'">` : ''}
        <div class="pc-header"><span class="pc-call">${_acEmoji(ac.category, ac.callsign, ac.model)} ${ac.callsign}</span><span class="pc-dist">${ac.dist_km} km</span></div>
        <div class="pc-model">${ac.model||'Unknown'}${ac.registration?' · '+ac.registration:''} · ${ac.origin_country}</div>
        <div class="pc-grid">
          <div class="pstat"><div class="pstat-val">${fmtAlt(ac.alt_ft||0)}</div><div class="pstat-lbl">${UNITS_SPEED==='metric'?'Metres':'Feet'}</div></div>
          <div class="pstat"><div class="pstat-val">${fmtSpeed(ac.speed_kts)}</div><div class="pstat-lbl">${UNITS_SPEED==='metric'?'km/h':'Knots'}</div></div>
          <div class="pstat"><div class="pstat-val" style="font-size:11px">${vrStr}</div><div class="pstat-lbl">V/S</div></div>
        </div>
      </div>`;
    }).join('');
  } else {
    const wasSearch = document.activeElement && document.activeElement.classList.contains('hist-search');
    const cursor = wasSearch ? document.activeElement.selectionStart : null;

    let html = `<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
      <input class="hist-search astro-search" type="text" placeholder="Search history…" value="${_histSearch.replace(/"/g,'&quot;')}" oninput="_histSearch=this.value;searchHistory()" style="flex:1;min-width:0">
      <button class="fav-filter-btn${_histFavOnly?' active':''}" onclick="toggleHistFav()" title="${_histFavOnly?'Show all':'Show favourites only'}">⭐</button>
      <button class="seen-filter-btn${_histSeenOnly?' active':''}" onclick="toggleHistSeen()" title="${_histSeenOnly?'Show all':'Show seen only'}">👁️</button>
    </div>`;

    if (!historyData.length) {
      html += `<div class="empty">${_histSearch ? 'No matches' : 'No alerts yet<br><small>Alerts appear here once triggered</small>'}</div>`;
    } else {
      html += historyData.map(_histCardHtml).join('');
    }
    if (_histHasMore) {
      html += `<button class="load-more-btn" onclick="loadMoreHistory()">Load more</button>`;
    }
    const savedScroll = el.scrollTop;
    el.innerHTML = html;
    void el.scrollHeight;
    el.scrollTop = savedScroll;
    if (_selectedHistId !== null) {
      const sel = el.querySelector(`.hist-card[data-id="${_selectedHistId}"]`);
      if (sel) sel.classList.add('selected');
    }
    if (wasSearch || _histSearch) {
      const inp = el.querySelector('.hist-search');
      if (inp) { inp.focus({ preventScroll: true }); if (cursor !== null) inp.setSelectionRange(cursor, cursor); }
    }
  }
}

const SAT_COLORS = {ISS:'#1abc9c', Hubble:'#9b59b6', Tiangong:'#e74c3c', Starlink:'#f39c12'};
const SAT_NAMES  = ['ISS', 'Hubble', 'Tiangong', 'Starlink'];
let _satPasses = [], _satSubTab = 'ISS', _satSubTabPrev = 'ISS';

function renderSatellites(passes) { _satPasses = passes; _drawSatellites(); }

function _drawSatellites() {
  const el = document.getElementById('pane-satellites');
  const subEl = document.getElementById('sidebar-sub-tabs');
  const col = SAT_COLORS[_satSubTab] || '#7b7f9e';
  const filtered = _satPasses.filter(p => (p.sat_name||'ISS') === _satSubTab);

  const tabsHtml = SAT_NAMES.map(n => {
    const count = _satPasses.filter(p=>(p.sat_name||'ISS')===n).length;
    return `<div class="sub-tab${_satSubTab===n?' active':''}" onclick="_satSubTab='${n}';_drawSatellites()">${n}${count?' ('+count+')':''}</div>`;
  }).join('');

  if (el.classList.contains('active')) { subEl.innerHTML = tabsHtml; subEl.style.display = ''; }

  let html = ``;

  if (!filtered.length) {
    const iss = _sourceStatus.iss;
    if (_satSubTab !== 'Starlink' && iss && iss.status === 'no_key') {
      html += `<div class="empty">Satellite passes unavailable<br><small>Add an n2yo API key in Settings to enable ${_satSubTab} tracking.</small></div>`;
    } else {
      const emptyHint = _satSubTab === 'Starlink'
        ? 'Computed from CelesTrak TLEs, refreshes every 6h'
        : 'Fetches every 2h, check n2yo key in Settings';
      html += `<div class="empty">No upcoming ${_satSubTab} passes<br><small>${emptyHint}</small></div>`;
    }
  } else {
    html += filtered.map(p => {
      const dt = new Date(p.pass_time * 1000);
      const soon = p.mins_away < 30;
      const cd = p.mins_away < 60 ? p.mins_away+' min' : Math.floor(p.mins_away/60)+'h '+(p.mins_away%60)+'m';
      const dur = p.duration >= 60 ? Math.floor(p.duration/60)+'m '+(p.duration%60)+'s' : p.duration+'s';
      return `<div class="iss-card" style="border-color:${col}55">
        <div class="iss-head">
          <span class="iss-title" style="color:${col}">${_satSubTab} - ${fmtDate(dt)}</span>
          ${soon ? `<span class="iss-soon" style="background:${col};color:#000">In ${cd}</span>` : ''}
        </div>
        <div class="iss-grid">
          <div class="pstat"><div class="pstat-val">${fmtTime(dt)}</div><div class="pstat-lbl">Time</div></div>
          <div class="pstat"><div class="pstat-val">${cd}</div><div class="pstat-lbl">From now</div></div>
          <div class="pstat"><div class="pstat-val">${dur}</div><div class="pstat-lbl">Duration</div></div>
          <div class="pstat"><div class="pstat-val">${p.start_az||'-'}</div><div class="pstat-lbl">Appears</div></div>
          <div class="pstat"><div class="pstat-val">${p.max_el!=null?p.max_el+'°':'-'}</div><div class="pstat-lbl">Max height</div></div>
          <div class="pstat"><div class="pstat-val">${p.end_az||'-'}</div><div class="pstat-lbl">Disappears</div></div>
        </div>
      </div>`;
    }).join('');
  }
  el.innerHTML = html;
  if (_satSubTab !== _satSubTabPrev) {
    el.scrollTop = 0;
    _satSubTabPrev = _satSubTab;
    if (window._updateBackTop) _updateBackTop();
  }
}

function renderHistory(data) {
  historyData = data.rows || data;
  _histHasMore = data.has_more || false;
  _histOffset = historyData.length;
  if (_aircraftTab === 'history') _drawAircraft();
}

function _histUrl(offset, limit) {
  let url = `/api/history?offset=${offset}`;
  if (limit)        url += `&limit=${limit}`;
  if (_histFavOnly)  url += '&favourites=1';
  if (_histSeenOnly) url += '&seen=1';
  if (_histSearch)  url += `&search=${encodeURIComponent(_histSearch)}`;
  return url;
}

async function searchHistory() {
  historyData = []; _histOffset = 0; _histHasMore = false;
  const data = await fetch(_histUrl(0)).then(r => r.json());
  historyData = data.rows || [];
  _histHasMore = data.has_more || false;
  _histOffset = historyData.length;
  _drawAircraft();
}

async function toggleHistFav() {
  _histFavOnly = !_histFavOnly;
  _histSeenOnly = false;

async function _drawStats() {
  const el = document.getElementById('pane-aircraft');
  el.innerHTML = '<div class="empty">Loading…</div>';
  let s;
  try { s = await fetch('/api/aircraft/stats').then(r => r.json()); }
  catch(e) { el.innerHTML = '<div class="empty">Failed to load stats</div>'; return; }
  if (!s.total) { el.innerHTML = '<div class="empty">No alert history yet</div>'; return; }

  const recSub = r => r ? `${r.callsign||'-'} · ${r.model||'Unknown'}` : '-';

  const maxHour = Math.max(...s.hours.map(h => h.n), 1);
  const hourBars = Array.from({length:24}, (_,i) => {
    const h = s.hours.find(x => x.hr === i);
    const pct = h ? Math.max(Math.round(h.n/maxHour*100), 4) : 4;
    return `<div class="hour-bar" style="height:${pct}%" data-tip="${i}:00 - ${h?h.n:0} alert${h&&h.n===1?'':'s'}"></div>`;
  }).join('');

  const barRows = (rows, max) => rows.map(r => `
    <div class="bar-row">
      <span class="bar-label" title="${r.label}">${r.label}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.n/max*100)}%"></div></div>
      <span class="bar-count">${r.n}</span>
    </div>`).join('');

  const maxC = (s.top_countries[0]||{}).n || 1;
  const maxM = (s.top_models[0]||{}).n || 1;

  el.innerHTML = `
    <div class="stats-section-hdr">Overview</div>
    <div class="stats-overview">
      <div class="stats-tile"><div class="stats-tile-val">${s.total}</div><div class="stats-tile-lbl">Total visits</div></div>
      <div class="stats-tile"><div class="stats-tile-val">${s.unique_aircraft}</div><div class="stats-tile-lbl">Aircraft</div></div>
      <div class="stats-tile"><div class="stats-tile-val">${s.unique_countries}</div><div class="stats-tile-lbl">Countries</div></div>
      <div class="stats-tile"><div class="stats-tile-val">${s.unique_models}</div><div class="stats-tile-lbl">Models</div></div>
    </div>
    <div class="stats-section-hdr">Records</div>
    <div class="stats-records">
      <div class="stats-rec"><div class="stats-rec-val">${s.closest ? s.closest.min_dist_km+' km' : '-'}</div><div class="stats-rec-lbl">Closest approach</div><div class="stats-rec-sub">${recSub(s.closest)}</div></div>
      <div class="stats-rec"><div class="stats-rec-val">${s.lowest ? fmtAlt(s.lowest.min_alt_ft) : '-'}</div><div class="stats-rec-lbl">Lowest altitude</div><div class="stats-rec-sub">${recSub(s.lowest)}</div></div>
      <div class="stats-rec"><div class="stats-rec-val">${s.most_visited ? s.most_visited.visits+' visits' : '-'}</div><div class="stats-rec-lbl">Most frequent</div><div class="stats-rec-sub">${recSub(s.most_visited)}</div></div>
    </div>
    <div class="stats-section-hdr">Alerts by hour</div>
    <div class="hour-chart-wrap">
      <div class="hour-tip" id="hour-tip"></div>
      <div class="hour-chart" id="hour-chart">${hourBars}</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:3px">
      ${['0:00','6:00','12:00','18:00','23:00'].map(t=>`<span style="font-size:8px;color:var(--muted)">${t}</span>`).join('')}
    </div>
    ${s.top_countries.length ? `<div class="stats-section-hdr">Top countries</div>${barRows(s.top_countries.map(r=>({...r,label:r.origin_country})),maxC)}` : ''}
    ${s.top_models.length ? `<div class="stats-section-hdr">Top models</div>${barRows(s.top_models.map(r=>({...r,label:r.model})),maxM)}` : ''}
  `;

  const chart = el.querySelector('#hour-chart');
  const tip   = el.querySelector('#hour-tip');
  if (chart && tip) {
    function _showTip(bar) {
      tip.textContent = bar.dataset.tip;
      tip.style.display = 'block';
      void tip.offsetWidth; // force reflow so offsetWidth is correct before clamping
      const cRect = chart.getBoundingClientRect();
      const bRect = bar.getBoundingClientRect();
      let left = bRect.left - cRect.left + bRect.width / 2;
      left = Math.max(tip.offsetWidth / 2, Math.min(left, cRect.width - tip.offsetWidth / 2));
      tip.style.left = left + 'px';
      chart.querySelectorAll('.hour-bar').forEach(b => b.classList.remove('active'));
      bar.classList.add('active');
    }
    function _hideTip() {
      tip.style.display = 'none';
      chart.querySelectorAll('.hour-bar').forEach(b => b.classList.remove('active'));
    }
    chart.querySelectorAll('.hour-bar').forEach(bar => {
      bar.addEventListener('mouseenter', () => _showTip(bar));
      bar.addEventListener('mouseleave', _hideTip);
      bar.addEventListener('touchstart', e => { e.preventDefault(); _showTip(bar); }, { passive: false });
    });
    document.addEventListener('touchstart', e => {
      if (!e.target.classList.contains('hour-bar')) _hideTip();
    }, { passive: true });
  }
}

function uvLabel(uv) {
  if (uv <= 2)  return ['Low',      '#2ecc71'];
  if (uv <= 5)  return ['Moderate', '#f1c40f'];
  if (uv <= 7)  return ['High',     '#e67e22'];
  if (uv <= 10) return ['V.High',   '#e74c3c'];
  return ['Extreme','#9b59b6'];
}
function wmoEmoji(code) {
  if (code === 0 || code === 1) return '☀️';
  if (code === 2) return '⛅';
  if (code === 3) return '☁️';
  if (code <= 48) return '🌫️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '❄️';
  if (code <= 82) return '🌦️';
  return '⛈️';
}

let _aData = null, _aEquip = 2, _aHorizon = true, _aSearch = '', _astroTab = 'tonight', _astroTabPrev = 'tonight';
let _aTonightOpen = {planets: true, dso: true, meteors: true};
function toggleTonightSection(key) { _aTonightOpen[key] = !_aTonightOpen[key]; _drawAstro(); }
let _lazyObs = null;
function _initLazyImgs(root) {
  if (!('IntersectionObserver' in window)) {
    root.querySelectorAll('img[data-lazysrc]').forEach(img => { img.src = img.dataset.lazysrc; });
    return;
  }
  if (!_lazyObs) {
    _lazyObs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const img = e.target;
        img.src = img.dataset.lazysrc;
        _lazyObs.unobserve(img);
      });
    }, { rootMargin: '300px' });
  }
  root.querySelectorAll('img[data-lazysrc]').forEach(img => _lazyObs.observe(img));
}
const _ETIER = {naked_eye:0, binoculars:1, telescope:2};
const _EICON = {naked_eye:'👁️', binoculars:'🔭', telescope:'⭐'};
const _CONST = {And:'Andromeda',Aqr:'Aquarius',Aur:'Auriga',Cap:'Capricornus',Cas:'Cassiopeia',
  Cet:'Cetus',CMa:'Canis Major',Cnc:'Cancer',Com:'Coma Berenices',CVn:'Canes Venatici',
  Cyg:'Cygnus',Dra:'Draco',Gem:'Gemini',Her:'Hercules',Hya:'Hydra',Leo:'Leo',Lep:'Lepus',
  Lyr:'Lyra',Mon:'Monoceros',Oph:'Ophiuchus',Ori:'Orion',Peg:'Pegasus',Per:'Perseus',
  Psc:'Pisces',Pup:'Puppis',Sco:'Scorpius',Sct:'Scutum',Sge:'Sagitta',Sgr:'Sagittarius',
  Ser:'Serpens',Tau:'Taurus',Tri:'Triangulum',UMa:'Ursa Major',Vir:'Virgo',Vul:'Vulpecula'};

function fmtTs(ts) { return ts ? fmtTime(new Date(ts * 1000)) : '-'; }

function renderAstronomy(astro) { _aData = astro; _drawAstro(); }

function _drawAstro() {
  const el = document.getElementById('pane-astronomy');
  const subEl = document.getElementById('sidebar-sub-tabs');
  const a = _aData || {};

  // Capture focus state before clobbering DOM
  const wasSearch = document.activeElement && document.activeElement.classList.contains('astro-search');
  const cursor = wasSearch ? document.activeElement.selectionStart : null;

  const TABS = [['tonight','🌃 Tonight'],['moon','🌙 Moon'],['planets','🪐 Planets'],['dso','🔭 DSOs'],['meteors','☄️ Meteors']];
  const tabBarHtml = TABS.map(([id,lbl])=>
    `<div class="sub-tab${_astroTab===id?' active':''}" onclick="_astroTab='${id}';_aSearch='';_drawAstro()">${lbl}</div>`
  ).join('');

  if (el.classList.contains('active')) { subEl.innerHTML = tabBarHtml; subEl.style.display = ''; }

  let body = '';
  if      (_astroTab === 'tonight') body = _astroTonight(a);
  else if (_astroTab === 'planets') body = _astroPlanets(a);
  else if (_astroTab === 'meteors') body = _astroMeteors(a);
  else if (_astroTab === 'dso')     body = _astroDSO(a);
  else if (_astroTab === 'moon')    body = _astroMoon(a.moon||{});

  const tabChanged = _astroTab !== _astroTabPrev;
  const savedScroll = tabChanged ? 0 : el.scrollTop;
  el.innerHTML = body;
  void el.scrollHeight;
  el.scrollTop = savedScroll;
  if (tabChanged) { _astroTabPrev = _astroTab; if (window._updateBackTop) _updateBackTop(); }
  _initLazyImgs(el);

  // Restore focus to search bar after re-render
  if (wasSearch || _aSearch) {
    const inp = el.querySelector('.astro-search');
    if (inp) { inp.focus({ preventScroll: true }); if (cursor !== null) inp.setSelectionRange(cursor, cursor); }
  }
}

function _skyBar(tw) {
  const t0 = tw.sunset, t1 = tw.sunrise;
  if (!t0 || !t1 || t1 <= t0) return '';
  const span = t1 - t0;
  const pct = ts => Math.max(0, Math.min(100, (ts - t0) / span * 100)).toFixed(1);
  const now = Math.floor(Date.now() / 1000);
  const segs = [
    [tw.sunset,           tw.civil_dusk,        '#2d5a9e'],
    [tw.civil_dusk,       tw.nautical_dusk,      '#1a3870'],
    [tw.nautical_dusk,    tw.astronomical_dusk,  '#0e2050'],
    [tw.astronomical_dawn,tw.nautical_dawn,      '#0e2050'],
    [tw.nautical_dawn,    tw.civil_dawn,         '#1a3870'],
    [tw.civil_dawn,       tw.sunrise,            '#2d5a9e'],
  ].filter(([a,b]) => a && b && b > a && a >= t0 && b <= t1);
  const nowPct = now >= t0 && now <= t1 ? ((now-t0)/span*100).toFixed(1) : null;
  return `<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px">
    <span>🌅 ${fmtTs(t0)}</span><span>🌄 ${fmtTs(t1)}</span>
  </div>
  <div class="sky-bar">
    ${segs.map(([a,b,c])=>`<div class="sky-seg" style="left:${pct(a)}%;width:${(pct(b)-pct(a)).toFixed(1)}%;background:${c}"></div>`).join('')}
    ${nowPct!==null?`<div class="sky-now-line" style="left:${nowPct}%"></div>`:''}
  </div>
  <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:2px">
    ${tw.astronomical_dusk?`<span>Dark ${fmtTs(tw.astronomical_dusk)}</span>`:'<span></span>'}
    ${tw.astronomical_dawn?`<span>Dawn ${fmtTs(tw.astronomical_dawn)}</span>`:'<span></span>'}
  </div>`;
}

function _astroTonight(a) {
  if (!a.ts) {
    const ast = _sourceStatus.astronomy;
    if (ast && ast.status === 'error') {
      return `<div class="empty" style="padding:24px">Astronomy data unavailable<br><small>Calculation failed, check back shortly.</small></div>`;
    }
    return `<div class="empty" style="padding:24px">Astronomy data loading…<br><small>Calculates on first startup, check back shortly.</small></div>`;
  }
  const tw = a.twilight || {}, mi = a.moon || {};
  const illum = mi.illumination != null ? mi.illumination : 0;
  const [ifLabel, ifCol] = illum < 25 ? ['Low','var(--green)'] : illum < 60 ? ['Moderate','var(--amber)'] : ['High','var(--red)'];
  const bortleCol = a.bortle ? (a.bortle.class <= 4 ? 'var(--green)' : a.bortle.class <= 6 ? 'var(--amber)' : 'var(--red)') : 'var(--muted)';
  const moonLine = mi.is_up ? `↑ ${mi.alt_deg}° · ${illum}% lit` : (mi.rise_ts ? `Rises ${fmtTs(mi.rise_ts)}` : 'Below horizon');
  const darkStr = tw.astronomical_dusk && tw.astronomical_dawn ? `${fmtTs(tw.astronomical_dusk)} – ${fmtTs(tw.astronomical_dawn)}` : '-';
  const bar = _skyBar(tw);

  // "Visible tonight" = above horizon at some point during astronomical darkness [dusk → dawn].
  // ephem next_setting(sun) returns tomorrow's dusk when called after dark, so detect that
  // case (dawn < dusk) and subtract 24h to recover tonight's actual dark-start.
  const dusk = tw.astronomical_dusk || tw.sunset;
  const dawn = tw.astronomical_dawn || tw.sunrise;
  const darkStart = (dusk && dawn && dawn < dusk) ? dusk - 86400 : dusk;
  const _upAtDusk = p => p.is_up && (!darkStart || !p.set_ts || p.set_ts > darkStart);
  const tonightPlanets = (a.planets||[])
    .filter(p => _upAtDusk(p) || (dawn && p.rise_ts && p.rise_ts < dawn))
    .sort((x,y) => (_upAtDusk(y) - _upAtDusk(x)) || (y.alt_deg - x.alt_deg));
  const tonightDSO = (a.dso||[])
    .filter(d => {
      if ((_ETIER[d.equipment]||0) > _aEquip) return false;
      if (d.transit_ts && darkStart && dawn)
        return d.transit_ts > darkStart - 2 * 3600 && d.transit_ts < dawn;
      return d.is_up;
    })
    .sort((x,y) => {
      if (x.is_up !== y.is_up) return y.is_up - x.is_up;
      if (x.is_up) return y.alt_deg - x.alt_deg;
      return (x.transit_ts||0) - (y.transit_ts||0);
    });
  const activeMeteors = (a.meteor_showers||[]).filter(s => s.active);

  const planetCards = tonightPlanets.map(p => {
    const upAtDusk = _upAtDusk(p);
    const upCol = upAtDusk ? 'var(--green)' : 'var(--muted)';
    const altStr = upAtDusk ? `↑ ${p.alt_deg}° ${p.az_compass}` : (p.rise_ts ? `Rises ${fmtTs(p.rise_ts)}` : '↓');
    const timeStr = upAtDusk
      ? (p.set_ts ? `Sets ${fmtTs(p.set_ts)}${p.transit_ts?' · Transit '+fmtTs(p.transit_ts):''}` : (p.transit_ts?`Transit ${fmtTs(p.transit_ts)}`:''))
      : (p.transit_ts ? `Transit ${fmtTs(p.transit_ts)}` : '');
    const img = p.wiki_thumb ? `<img class="ac-thumb" src="${p.wiki_thumb}" alt="${p.name}" decoding="async" style="cursor:pointer" data-full="${p.wiki_url||''}" onclick="openLightbox(this.src,this.dataset.full,'View on Wikipedia')" onerror="this.style.display='none'">` : '';
    return `<div class="astro-card">
      <div class="ac-with-img">${img}

          <div class="ac-head"><span class="ac-name">${p.name}</span><span class="ac-right" style="color:${upCol}">${altStr}</span></div>
          <div class="ac-meta">mag ${p.magnitude} · ${p.constellation||''}${p.distance_au?' · '+p.distance_au+' AU':''}</div>
          ${timeStr?`<div class="ac-time">${timeStr}</div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  const dsoCards = tonightDSO.map(d => {
    const upStr = d.is_up ? `↑ ${d.alt_deg}° ${d.az_compass}` : (d.transit_ts ? `Transit ${fmtTs(d.transit_ts)}` : '-');
    const moonW = d.moon_warning ? ' · 🌙 moon' : '';
    const img = d.wiki_thumb ? `<img class="ac-thumb" data-lazysrc="${d.wiki_thumb}" alt="${d.label}" decoding="async" style="cursor:pointer;background:var(--border)" data-full="${d.wiki_url||''}" onclick="openLightbox(this.dataset.lazysrc||this.src,this.dataset.full,'View on Wikipedia')" onerror="this.style.display='none'">` : '';
    return `<div class="astro-card">
      <div class="ac-with-img">${img}
        <div class="ac-thumb-body">
          <div class="ac-head"><span class="ac-name">M${d.id}${d.name&&d.name!=='M'+d.id?' - '+d.name:''}</span><span class="ac-right">${_EICON[d.equipment]||''} ${d.magnitude}</span></div>
          <div class="ac-meta">${d.type} · ${_CONST[d.constellation]||d.constellation}</div>
          <div class="ac-time">${upStr}${moonW}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  const meteorCards = activeMeteors.map(s => {
    const img = s.wiki_thumb ? `<img class="ac-thumb" src="${s.wiki_thumb}" alt="${s.name}" decoding="async" style="cursor:pointer" data-full="${s.wiki_url||''}" onclick="openLightbox(this.src,this.dataset.full,'View on Wikipedia')" onerror="this.style.display='none'">` : '';
    return `<div class="astro-card">
      <div class="ac-with-img">${img}
        <div class="ac-thumb-body">
          <div class="ac-head"><span class="ac-name">${s.name}</span><span class="a-badge live">ACTIVE</span></div>
          <div class="ac-meta">ZHR ${s.zhr} · Radiant: ${s.radiant} · ${s.parent}</div>
          ${s.note?`<div class="ac-note">${s.note}</div>`:''}
          <div class="ac-time">Peak: ${s.peak_date} · Active until ${s.active_end}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  return `
    ${bar ? `<div style="margin-bottom:10px">${bar}</div>` : ''}
    <div class="at-grid">
      <div class="at-metric">
        <div class="at-metric-icon">🌑</div>
        <div class="at-metric-val">${darkStr}</div>
        <div class="at-metric-sub">Astronomical dark</div>
      </div>
      <div class="at-metric">
        <div class="at-metric-icon">💡</div>
        <div class="at-metric-val" style="color:${bortleCol}">${a.bortle ? 'Class '+a.bortle.class : '-'}</div>
        <div class="at-metric-sub">${a.bortle ? a.bortle.description : 'Light pollution'}</div>
      </div>
      <div class="at-metric">
        <div class="at-metric-icon">${mi.phase_emoji||'🌙'}</div>
        <div class="at-metric-val" style="color:${ifCol}">${ifLabel} interference</div>
        <div class="at-metric-sub">${moonLine}</div>
      </div>
      <div class="at-metric">
        <div class="at-metric-icon">🌅</div>
        <div class="at-metric-val">${tw.sunset?fmtTs(tw.sunset):'-'} – ${tw.sunrise?fmtTs(tw.sunrise):'-'}</div>
        <div class="at-metric-sub">Sunset / Sunrise</div>
      </div>
    </div>
    ${tonightPlanets.length ? `
    <div class="astro-sec">
      <div class="astro-sec-hdr" onclick="toggleTonightSection('planets')">
        <span class="astro-sec-title">🪐 Planets tonight <span class="astro-sec-badge">${tonightPlanets.length}</span></span>
        <span class="astro-sec-chev">${_aTonightOpen.planets ? '▾' : '▸'}</span>
      </div>
      ${_aTonightOpen.planets ? `<div class="astro-sec-body">${planetCards}</div>` : ''}
    </div>` : ''}
    <div class="astro-sec">
      <div class="astro-sec-hdr" onclick="toggleTonightSection('dso')">
        <span class="astro-sec-title">🔭 DSOs tonight <span class="astro-sec-badge">${tonightDSO.length}</span></span>
        <span class="astro-sec-chev">${_aTonightOpen.dso ? '▾' : '▸'}</span>
      </div>
      ${_aTonightOpen.dso ? `<div class="astro-sec-body"><div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">${_equipBtns()}</div>${tonightDSO.length ? dsoCards : `<div class="astro-empty">No DSOs visible with current equipment filter</div>`}</div>` : ''}
    </div>
    ${activeMeteors.length ? `
    <div class="astro-sec">
      <div class="astro-sec-hdr" onclick="toggleTonightSection('meteors')">
        <span class="astro-sec-title">☄️ Active meteor showers <span class="astro-sec-badge">${activeMeteors.length}</span></span>
        <span class="astro-sec-chev">${_aTonightOpen.meteors ? '▾' : '▸'}</span>
      </div>
      ${_aTonightOpen.meteors ? `<div class="astro-sec-body">${meteorCards}</div>` : ''}
    </div>` : ''}
    ${!tonightPlanets.length && !tonightDSO.length && !activeMeteors.length ? `<div class="astro-empty" style="padding:24px">Nothing found, check back after dusk</div>` : ''}`;
}

function _astroPlanets(a) {
  const q = _aSearch.toLowerCase();
  const list = (a.planets||[]).filter(p =>
    (!_aHorizon || p.is_up) &&
    (!q || p.name.toLowerCase().includes(q) || (p.constellation||'').toLowerCase().includes(q))
  ).sort((x,y) => y.alt_deg - x.alt_deg);

  let html = `<div class="sub-filter">${_searchBar('Search planets…')}<div style="display:flex;gap:4px">${_horizonBtn()}</div></div>`;
  if (!list.length) return html + `<div class="astro-empty">${_aHorizon?'No planets above horizon, disable Horizon filter to see all':'No planets match'}</div>`;
  return html + list.map(p => {
    const upCol = p.is_up ? 'var(--green)' : 'var(--muted)';
    const altStr = p.is_up ? `↑ ${p.alt_deg}° ${p.az_compass}` : '↓ below horizon';
    const timeStr = p.is_up ? (p.set_ts?`Sets ${fmtTs(p.set_ts)}`:'') : (p.rise_ts?`Rises ${fmtTs(p.rise_ts)}`:'');
    const img = p.wiki_thumb ? `<img class="ac-thumb" src="${p.wiki_thumb}" alt="${p.name}" decoding="async" style="cursor:pointer" data-full="${p.wiki_url||''}" onclick="openLightbox(this.src,this.dataset.full,'View on Wikipedia')" onerror="this.style.display='none'">` : '';
    return `<div class="astro-card">
      <div class="ac-with-img">
        ${img}
        <div class="ac-thumb-body">
          <div class="ac-head"><span class="ac-name">${p.name}</span><span class="ac-right" style="color:${upCol}">${altStr}</span></div>
          <div class="ac-meta">mag ${p.magnitude} · ${p.constellation||''}${p.distance_au?' · '+p.distance_au+' AU':''}</div>
          ${timeStr?`<div class="ac-time">${timeStr}${p.transit_ts?' · Transit '+fmtTs(p.transit_ts):''}</div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function _astroMeteors(a) {
  const q = _aSearch.toLowerCase();
  const list = (a.meteor_showers||[]).filter(s =>
    !q || s.name.toLowerCase().includes(q) || (s.parent||'').toLowerCase().includes(q)
  );

    const badge = s.active ? `<span class="a-badge live">ACTIVE</span>` : `<span class="a-badge">${s.days_to_peak<0?'passed':'in '+s.days_to_peak+'d'}</span>`;
    const img = s.wiki_thumb ? `<img class="ac-thumb" src="${s.wiki_thumb}" alt="${s.name}" decoding="async" style="cursor:pointer" data-full="${s.wiki_url||''}" onclick="openLightbox(this.src,this.dataset.full,'View on Wikipedia')" onerror="this.style.display='none'">` : '';
    return `<div class="astro-card">
      <div class="ac-with-img">
        ${img}
        <div class="ac-thumb-body">
          <div class="ac-head"><span class="ac-name">${s.name}</span>${badge}</div>

function _astroDSO(a) {

    (!_aHorizon || d.is_up) &&
    (_ETIER[d.equipment]||0) <= _aEquip &&

// ── Source status bar ─────────────────────────────────────────────────────────
// opensky/iss start from the config values at page load, then get kept in sync
// with Settings changes in refresh() below (poll_interval/iss_check_hours are
// user-configurable). weather/astronomy are fixed, mirrored from tracker.py's
// WEATHER_INTERVAL/ASTRONOMY_INTERVAL, which aren't user-configurable at all.
const REFRESH_SECS = {
  opensky:   {{ cfg.poll_interval }},
  iss:       {{ cfg.iss_check_hours }} * 3600,
  weather:   900,
  astronomy: 3600,
};

let _statusMeta = {};

function fmtCountdown(ms) {
  const s   = Math.floor(ms / 1000);
  const h   = Math.floor(s / 3600);
  const m   = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const mm  = String(m).padStart(2, '0');
  const ss  = String(sec).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
}

function renderStatus(rows) {
  _sourceStatus = {};
  (rows||[]).forEach(r => _sourceStatus[r.source] = r);
  ['opensky','iss','weather','astronomy'].forEach(src => {
    const r    = _sourceStatus[src];
    const item = document.getElementById('si-'+src);
    if (item) delete item.dataset.tip;
    if (!r) { if (item) item.className = 'src-item'; _statusMeta[src] = null; return; }
    if (item) item.className = 'src-item ' + r.status;
    if (r.status === 'no_key') {
      _statusMeta[src] = { mode: 'static', text: 'No Key' };
    } else if (r.status === 'backoff') {
      const match = (r.detail||'').match(/(\d+)\s*min/);
      const mins  = match ? parseInt(match[1], 10) : 1;
      if (item && r.detail) item.dataset.tip = r.detail;
      _statusMeta[src] = {
        mode: 'countdown', showNumber: false, prefix: 'Rate Limited.', zeroText: 'Retrying...',
        deadline: r.last_error*1000 + mins*60000,
      };
    } else if (r.status === 'error') {
      if (item && r.detail) item.dataset.tip = r.detail;
      _statusMeta[src] = {
        mode: 'countdown', showNumber: false, prefix: 'Error.', zeroText: 'Retrying...',
        deadline: Math.max(r.last_success||0, r.last_error||0)*1000 + REFRESH_SECS[src]*1000,
      };
    } else {
      _statusMeta[src] = {
        mode: 'countdown', showNumber: true, prefix: '', zeroText: 'Fetching...',
        deadline: Math.max(r.last_success||0, r.last_error||0)*1000 + REFRESH_SECS[src]*1000,
      };
    }
  });
  tickStatus();
}

function tickStatus() {
  const now = Date.now();
  ['opensky','iss','weather','astronomy'].forEach(src => {
    const lbl  = document.getElementById('st-'+src);
    const meta = _statusMeta[src];
    if (!lbl) return;
    if (!meta) { lbl.textContent = 'no data'; return; }
    if (meta.mode === 'static') { lbl.textContent = meta.text; return; }
    const remaining = meta.deadline - now;
    lbl.textContent = remaining <= 0 ? meta.zeroText : (meta.showNumber ? fmtCountdown(remaining) : meta.prefix);
  });
}

setInterval(tickStatus, 1000);

// ── Single refresh function ───────────────────────────────────────────────────
async function refresh() {
  try {
    const [aircraft, satellites, history, stats, cur, hourly, daily, astronomy, liveCfg] = await Promise.all([
      fetch('/api/live').then(r=>r.json()),
      fetch('/api/satellites').then(r=>r.json()),
      fetch(_histUrl(0, Math.max(25,_histOffset))).then(r=>r.json()),
      fetch('/api/stats').then(r=>r.json()),
      fetch('/api/weather/current').then(r=>r.json()),
      fetch('/api/weather/hourly').then(r=>r.json()),
      fetch('/api/weather/daily').then(r=>r.json()),
      fetch('/api/astronomy').then(r=>r.json()),
      fetch('/api/config').then(r=>r.json()),
    ]);
    if (cur && cur.timezone) locationTZ = cur.timezone;
    if (stats.use_location_time !== undefined) USE_LOC_TZ = stats.use_location_time;
    if (stats.time_format) TIME_24H = (stats.time_format === '24h');
    // Keep the status footer's countdown in sync with Settings changes, even
    // if they were made from another tab/device with this dashboard left open.
    if (liveCfg.poll_interval)   REFRESH_SECS.opensky = liveCfg.poll_interval;
    if (liveCfg.iss_check_hours) REFRESH_SECS.iss     = liveCfg.iss_check_hours * 3600;
    updateMap(aircraft);
    renderNearby(aircraft);
    renderSatellites(satellites);
    renderHistory(history);
    renderWeather(cur, hourly, daily);
    renderAstronomy(astronomy);
    document.getElementById('s-live').textContent      = stats.live;
    document.getElementById('s-today').textContent     = stats.today;
    document.getElementById('s-total').textContent     = stats.total;
    document.getElementById('s-countries').textContent = stats.countries;
    // Weather
    if (cur && cur.temp != null) {
      document.getElementById('s-weather').textContent = `${wmoEmoji(cur.weather_code)} ${fmtTemp(cur.temp)}`;
      document.getElementById('s-weather').removeAttribute('title');
    } else if (_sourceStatus.weather && _sourceStatus.weather.status === 'error') {
      document.getElementById('s-weather').textContent = '⚠️';
      document.getElementById('s-weather').title = "Weather data unavailable, Open-Meteo isn't responding";
    }
  } catch(e) { console.error('Refresh error:', e); }
}

// /api/status is a cheap local DB read (no external calls), so it's polled on
// its own faster cycle, independent of the main 15s refresh(). Otherwise the
// footer's "Fetching..." state can linger for up to a full refresh() cycle
// after the real update lands, since poll_interval defaults to the same 15s.
async function refreshStatus() {
  try {
    const status = await fetch('/api/status').then(r=>r.json());
    renderStatus(status);
  } catch(e) { console.error('Status refresh error:', e); }
}

async function fetchLocationName() {
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${_initLat}&lon=${_initLon}&format=json&zoom=14`,
      {headers:{'Accept-Language':'en'}}
    );
    const d = await r.json();
    const a = d.address || {};
    const suburb = a.suburb || a.neighbourhood || a.town || a.village || a.city || '';
    const state  = a.state || '';
    const stateShort = state.split(' ').map(w => w[0]).join('');
    const country = a.country || '';
    const loc = [suburb, stateShort, country].filter(Boolean).join(', ');
    if (loc) document.getElementById('home-loc').textContent = loc;
  } catch(e) {}
}

refresh();
refreshStatus();
setInterval(refresh, 15000);
setInterval(refreshStatus, 3000);

// ── First-run modal ────────────────────────────────────────────────────────────
// Deferred to DOMContentLoaded: the modal markup is defined further down the
// page, after this script tag, so it doesn't exist in the DOM yet if this runs
// synchronously during initial parsing.
document.addEventListener('DOMContentLoaded', () => {
if (FIRST_RUN && !sessionStorage.getItem('skybro_first_run_dismissed')) {
  const html = _detectedCity
    ? `👋 Welcome to SkyBro!<br><br>We've set your location to ${_detectedCity} based on your timezone.<br><br>You can refine this in Settings, and optionally add API keys for aircraft and satellite tracking.`
    : `👋 Welcome to SkyBro!<br><br>We couldn't detect your location automatically. Please set your home coordinates in Settings.<br><br>You can also optionally add API keys there for aircraft and satellite tracking.`;
  document.getElementById('frm-text').innerHTML = html;
  document.getElementById('first-run-modal').style.display = 'flex';
  document.getElementById('frm-ok').addEventListener('click', () => {
    sessionStorage.setItem('skybro_first_run_dismissed', '1');
    document.getElementById('first-run-modal').style.display = 'none';
  });
  document.getElementById('frm-settings').addEventListener('click', () => {
    window.location.href = '/settings';
  });
}
});
</script>
<div class="confirm-overlay" id="confirm-overlay" onclick="closeConfirm()">
  <div class="confirm-box" onclick="event.stopPropagation()">
    <p id="confirm-msg"></p>
    <div class="confirm-actions">
      <button class="confirm-ok" id="confirm-ok-btn"></button>
      <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
    </div>
  </div>
</div>
<div class="lb" id="lb" onclick="closeLightbox()">
  <span class="lb-close" onclick="closeLightbox()">✕</span>
  <img id="lb-img" src="" alt="" onclick="event.stopPropagation()">
  <div class="lb-credit" id="lb-credit"></div>
</div>
<div class="first-run-modal" id="first-run-modal">
  <div class="frm-box">
    <p id="frm-text"></p>
    <div class="frm-actions">
      <button id="frm-settings">Go to Settings</button>
      <button id="frm-ok">Looks good</button>
    </div>
  </div>
</div>
</body>
</html>
